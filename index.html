<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Patrício</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--sidebar:#161b22;--card:#1c2333;--card2:#21262d;
  --border:#30363d;--red:#e63946;--red2:#c1121f;--green:#2ea043;
  --blue:#1f6feb;--orange:#fb8500;--purple:#8b5cf6;--text:#e6edf3;
  --muted:#8b949e;--yellow:#f0c000;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* ===== LOGIN ===== */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d1117 0%,#1c1f2e 50%,#1a0a0a 100%)}
.login-box{background:var(--card);border:1px solid var(--border);padding:44px 40px;border-radius:16px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,.6);text-align:center}
.login-logo{width:64px;height:64px;background:var(--red);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.login-box input{width:100%;padding:11px 14px;margin-bottom:14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.login-box button:hover{background:var(--red2)}
.login-error{color:var(--red);font-size:13px;margin-top:10px;display:none}

/* ===== APP LAYOUT ===== */
#app{display:none;height:100vh;flex-direction:column}
.app-header{height:56px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;z-index:100}
.app-header .hamburger{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.app-header .hamburger:hover{background:var(--card2);color:var(--text)}
.app-header h2{font-size:18px;font-weight:600;flex:1}
.app-header .hactions{display:flex;align-items:center;gap:10px}
.app-header .hactions .icon-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;border-radius:8px;transition:.2s;position:relative}
.app-header .hactions .icon-btn:hover{background:var(--card2);color:var(--text)}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--red);border-radius:50%}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);padding:5px 12px;border-radius:20px;font-size:13px}
.user-chip .badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.btn-logout{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.app-body{display:flex;flex:1;overflow:hidden}

/* ===== SIDEBAR ===== */
#sidebar{width:220px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;overflow-y:auto;transition:width .25s;flex-shrink:0}
#sidebar.collapsed{width:56px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar-logo .logo-icon{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo .logo-text{font-size:13px;line-height:1.3;overflow:hidden;white-space:nowrap}
.sidebar-logo .logo-text strong{display:block;font-size:14px}
.sidebar-logo .logo-text span{color:var(--muted);font-size:11px}
.nav-section{padding:0 12px;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;padding:8px 8px 4px;overflow:hidden;white-space:nowrap}
#sidebar.collapsed .nav-section-label{opacity:0}
.nav-btn{width:100%;background:none;border:none;color:var(--muted);text-align:left;padding:9px 10px;cursor:pointer;font-size:13px;border-radius:8px;display:flex;align-items:center;gap:10px;transition:.15s;white-space:nowrap;overflow:hidden;position:relative}
.nav-btn:hover{background:var(--card2);color:var(--text)}
.nav-btn.active{background:rgba(230,57,70,.15);color:var(--red);font-weight:600}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.nav-btn .nav-label{overflow:hidden}
#sidebar.collapsed .nav-label{display:none}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
#sidebar.collapsed .nav-badge{display:none}

/* ===== MAIN ===== */
#main-content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.page{display:none}
.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.page-header h2{font-size:22px;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:22px}

/* ===== CARDS ===== */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;transition:.2s}
.metric-card:hover{border-color:#444;transform:translateY(-1px)}
.metric-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.metric-card .metric-val{font-size:24px;font-weight:700;line-height:1.1}
.metric-card .metric-label{font-size:12px;color:var(--muted);margin-top:2px}
.metric-card .metric-sub{font-size:11px;margin-top:3px}

/* ===== CHARTS ===== */
.chart-row{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.chart-box h3{font-size:15px;margin-bottom:16px}
.ranking-list{display:flex;flex-direction:column;gap:10px}
.rank-item{display:flex;align-items:center;gap:10px}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-num.gold{background:#f0c000;color:#000}
.rank-num.silver{background:#8b949e}
.rank-num.bronze{background:#fb8500}
.rank-bar-wrap{flex:1}
.rank-name{font-size:13px;margin-bottom:3px}
.rank-bar{height:6px;background:var(--red);border-radius:3px;opacity:.8}
.rank-count{font-size:12px;color:var(--muted);flex-shrink:0}

/* ===== TABLES ===== */
.table-box{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--card2);padding:11px 16px;text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* ===== BUTTONS ===== */
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red2)}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-gray{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-gray:hover{background:#2d333b}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}

/* ===== FORMS ===== */
.form-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:.2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--red)}
.form-row select option{background:var(--card)}
.form-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ===== STATUS ===== */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;gap:4px}
.badge-pending{background:rgba(240,192,0,.15);color:var(--yellow);border:1px solid rgba(240,192,0,.3)}
.badge-making{background:rgba(31,111,235,.15);color:#58a6ff;border:1px solid rgba(31,111,235,.3)}
.badge-delivery{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3)}
.badge-ready{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.badge-done{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.badge-cancelled{background:rgba(230,57,70,.15);color:var(--red);border:1px solid rgba(230,57,70,.3)}
.badge-active{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.badge-inactive{background:rgba(139,148,158,.15);color:var(--muted);border:1px solid rgba(139,148,158,.2)}
.badge-dine{background:rgba(251,133,0,.15);color:var(--orange);border:1px solid rgba(251,133,0,.3)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.modal-lg{width:700px}

/* ===== PDV ===== */
.pdv-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;min-height:calc(100vh - 160px)}
.pdv-products{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.pdv-cart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.product-search{width:100%;padding:10px 14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:14px}
.product-search:focus{border-color:var(--red)}
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.cat-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.cat-tab.active,.cat-tab:hover{background:var(--red);color:#fff;border-color:var(--red)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.product-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;transition:.15s;text-align:center}
.product-card:hover{border-color:var(--red);transform:translateY(-2px)}
.pc-icon{font-size:28px;margin-bottom:6px}
.product-card .pc-name{font-size:13px;font-weight:600;margin-bottom:4px}
.product-card .pc-price{font-size:12px;color:var(--red)}
.product-card .pc-sizes{font-size:10px;color:var(--muted);margin-top:2px}

.cart-items{flex:1;overflow-y:auto;margin-bottom:14px}
.cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600}
.cart-item-sub{font-size:11px;color:var(--muted);margin-top:1px}
.cart-item-price{font-size:13px;font-weight:700;color:var(--red);flex-shrink:0}
.cart-item-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;transition:.15s}
.cart-item-remove:hover{color:var(--red);background:rgba(230,57,70,.1)}
.cart-total-box{border-top:1px solid var(--border);padding-top:14px}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
.cart-total-row.big{font-size:18px;font-weight:700;color:var(--text)}
.cart-obs{width:100%;padding:8px 10px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;resize:none;margin-bottom:12px}
.payment-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.pay-btn{padding:8px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s;font-weight:600}
.pay-btn.active,.pay-btn:hover{border-color:var(--green);color:var(--green);background:rgba(46,160,67,.1)}

/* ===== KITCHEN ===== */
.kitchen-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.kitchen-col-title{font-size:13px;font-weight:700;margin-bottom:10px;padding:8px 12px;border-radius:8px;text-align:center}
.kc-pending{background:rgba(240,192,0,.1);color:var(--yellow)}
.kc-making{background:rgba(31,111,235,.1);color:#58a6ff}
.kc-ready{background:rgba(46,160,67,.1);color:#3fb950}
.kitchen-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.kitchen-card.urgent{border-color:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.3)}50%{box-shadow:0 0 0 6px rgba(230,57,70,0)}}
.kitchen-card h4{font-size:14px;font-weight:700;margin-bottom:6px;display:justify;justify-content:space-between}
.kitchen-card .kc-items{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.kitchen-card .kc-time{font-size:11px;color:var(--muted);margin-bottom:8px}

/* ===== SIZES CONFIG ===== */
.size-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px;background:#0d1117;border-radius:8px;border:1px solid var(--border)}
.size-row input{flex:1;padding:6px 10px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.size-row input:focus{border-color:var(--red)}
.size-row .remove-size{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;transition:.15s}
.size-row .remove-size:hover{color:var(--red)}

/* ===== DELIVERY CARDS ===== */
.delivery-cards{display:flex;flex-direction:column;gap:10px}

/* ===== PRINT STYLES ===== */
@media print {
  body * { visibility: hidden; }
  #print-section, #print-section * { visibility: visible; }
  #print-section { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; padding: 20px; display: block !important; font-family: 'Courier New', Courier, monospace; }
}
#print-section { display: none; }

.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.mesa-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:.2s}
.mesa-card.occupied{border-color:var(--orange);background:rgba(251,133,0,.05)}
.mesa-card.free{border-color:var(--green);background:rgba(46,160,67,.05)}
.mesa-num{font-size:18px;font-weight:800}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🍕</div>
    <h1>Pizzaria Patrício</h1>
    <input id="login-user" placeholder="Usuário" value="admin">
    <input id="login-pass" type="password" placeholder="Senha" value="pizza123">
    <button onclick="doLogin()">Entrar</button>
    <div id="login-error" class="login-error">Erro no login</div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <h2 id="page-title">Dashboard</h2>
    <div class="hactions">
      <div class="user-chip"><span id="header-name">Admin</span></div>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <div class="app-body">
    <nav id="sidebar"><div id="nav-items"></div></nav>
    <main id="main-content"></main>
  </div>
</div>
<div id="print-section"></div>

<script>
// --- STORAGE ---
const S = {
  get:(k,d)=>JSON.parse(localStorage.getItem(k))??d,
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};

function initData(){
  if(!S.get('pp_users')) S.set('pp_users', [{id:1,username:'admin',password:'pizza123',name:'Administrador',role:'admin',active:true}]);
  if(!S.get('pp_orders')) S.set('pp_orders', []);
  if(!S.get('pp_tables')) S.set('pp_tables', Array.from({length:12},(_,i)=>({id:i+1})));
  if(!S.get('pp_products')) S.set('pp_products', [
    {id:1,name:'Calabresa',category:'Pizza',active:true,sizes:[{name:'Broto',price:28},{name:'Média',price:38},{name:'Grande',price:48},{name:'Família',price:58}]},
    {id:2,name:'Margherita',category:'Pizza',active:true,sizes:[{name:'Broto',price:26},{name:'Média',price:36},{name:'Grande',price:45},{name:'Família',price:55}]},
    {id:3,name:'Frango c/ Catupiry',category:'Pizza',active:true,sizes:[{name:'Broto',price:30},{name:'Média',price:42},{name:'Grande',price:52},{name:'Família',price:62}]},
    {id:4,name:'Quatro Queijos',category:'Pizza',active:true,sizes:[{name:'Broto',price:32},{name:'Média',price:44},{name:'Grande',price:55},{name:'Família',price:65}]},
    {id:5,name:'Coxinha',category:'Salgado',active:true,sizes:[{name:'Unidade',price:6}]},
    {id:6,name:'Esfiha',category:'Salgado',active:true,sizes:[{name:'Unidade',price:5}]},
    {id:7,name:'Coca-Cola 2L',category:'Bebida',active:true,sizes:[{name:'2 Litros',price:12}]},
    {id:8,name:'Suco Natural 500ml',category:'Bebida',active:true,sizes:[{name:'500ml',price:10}]},
  ]);
  if(!S.get('pp_borders')) S.set('pp_borders',[{id:1,name:'Sem Borda',price:0},{id:2,name:'Catupiry',price:5},{id:3,name:'Cheddar',price:5}]);
}

// --- AUTH ---
let currentUser = null;
function doLogin(){
  const u=document.getElementById('login-user').value;
  const p=document.getElementById('login-pass').value;
  const user=S.get('pp_users',[]).find(x=>x.username===u && x.password===p);
  if(!user) return alert('Erro');
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  buildSidebar(); navigate('dashboard');
}
function doLogout(){ location.reload(); }

// --- NAV ---
let currentPage = '';
const PAGES = {
  dashboard: {icon:'📊',label:'Dashboard'},
  pdv: {icon:'🖥️',label:'PDV'},
  orders: {icon:'🧾',label:'Pedidos'},
  tables: {icon:'🪑',label:'Mesas'},
  financeiro: {icon:'💰',label:'Financeiro'}
};
function buildSidebar(){
  let h='';
  Object.entries(PAGES).forEach(([id,p])=>{
    h+=`<button class="nav-btn ${currentPage===id?'active':''}" onclick="navigate('${id}')"><span>${p.icon}</span> ${p.label}</button>`;
  });
  document.getElementById('nav-items').innerHTML=h;
}
function navigate(p){
  currentPage=p;
  document.getElementById('page-title').textContent=PAGES[p].label;
  const el=document.getElementById('main-content');
  buildSidebar();
  if(window[p]) window[p](el);
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); }

// --- HELPERS ---
const fmt = v => 'R$ ' + Number(v||0).toFixed(2).replace('.',',');
const now = () => new Date().toLocaleString('pt-BR');
function openModal(h){
  const d=document.createElement('div'); d.className='modal-overlay'; d.innerHTML=h;
  d.onclick=e=>{if(e.target===d) closeModal();};
  document.body.appendChild(d);
}
function closeModal(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.remove()); }

// --- PAGES ---
function dashboard(el){
  const os=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=os.reduce((s,o)=>s+o.total,0);
  el.innerHTML=`<div class="metric-grid">
    <div class="metric-card"><div class="metric-icon">💰</div><div><div class="metric-val">${fmt(total)}</div><div class="metric-label">Vendas Hoje</div></div></div>
    <div class="metric-card"><div class="metric-icon">📋</div><div><div class="metric-val">${os.length}</div><div class="metric-label">Pedidos Finalizados</div></div></div>
  </div>`;
}

let cart=[];
let orderType='delivery';
let multiPayments=[];
let selectedCat='Todos';

function pdv(el){
  cart=[]; multiPayments=[];
  const prods=S.get('pp_products',[]).filter(p=>p.active);
  const cats=['Todos',...new Set(prods.map(p=>p.category))];
  
  el.innerHTML=`<div class="pdv-layout">
    <div class="pdv-products">
      <div class="cat-tabs">${cats.map(c=>`<button class="cat-tab ${selectedCat===c?'active':''}" onclick="selectedCat='${c}';navigate('pdv')">${c}</button>`).join('')}</div>
      <div class="product-grid">${prods.filter(p=>selectedCat==='Todos'||p.category===selectedCat).map(p=>productCard(p)).join('')}</div>
    </div>
    <div class="pdv-cart">
      <div style="display:flex;gap:4px;margin-bottom:10px">
        <button class="btn ${orderType==='delivery'?'btn-red':'btn-gray'}" onclick="orderType='delivery';navigate('pdv')" style="flex:1">Delivery</button>
        <button class="btn ${orderType==='mesa'?'btn-red':'btn-gray'}" onclick="orderType='mesa';navigate('pdv')" style="flex:1">Mesa</button>
      </div>
      <input id="c-name" class="product-search" placeholder="Nome do Cliente" style="margin-bottom:8px">
      <select id="c-table" class="product-search" style="margin-bottom:8px; display:${orderType==='mesa'?'block':'none'}"></select>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-total-row big"><span>Total</span><span id="t-val">R$ 0,00</span></div>
      <div id="pay-area" style="display:${orderType==='mesa'?'none':'block'}">
        <p style="font-size:11px; color:var(--muted); margin-bottom:5px">PAGAMENTO</p>
        <div id="p-list"></div>
        <div style="display:grid;grid-template-columns: 1fr 1fr 40px; gap:4px; margin-top:5px">
          <select id="p-type"><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="pix">Pix</option></select>
          <input id="p-val" type="number" step="0.01" placeholder="Valor">
          <button class="btn btn-green btn-xs" onclick="addPay()">+</button>
        </div>
      </div>
      <button class="btn btn-red" style="width:100%;margin-top:15px;padding:12px" onclick="saveOrder()">✅ Finalizar Pedido</button>
    </div>
  </div>`;
  if(orderType==='mesa') loadFreeTables();
}

function loadFreeTables(){
  const ts=S.get('pp_tables',[]); const os=S.get('pp_orders',[]);
  const free=ts.filter(t=>!os.find(o=>o.tableId===t.id && o.status!=='done'));
  const sel=document.getElementById('c-table');
  if(sel) sel.innerHTML='<option value="">Selecione a Mesa</option>'+free.map(t=>`<option value="${t.id}">Mesa ${t.id}</option>`).join('');
}

function productCard(p){
  const icons={Pizza:'🍕',Salgado:'🥐',Bebida:'🥤'};
  return `<div class="product-card" onclick="addToCart(${p.id})">
    <div class="pc-icon">${icons[p.category]||'🍽️'}</div>
    <div class="pc-name">${p.name}</div>
    <div class="pc-price">${fmt(p.sizes[0].price)}</div>
  </div>`;
}

function addToCart(id){
  const p=S.get('pp_products',[]).find(x=>x.id===id);
  cart.push({name:p.name, price:p.sizes[0].price});
  renderCart(); updateCartTotal();
}

function renderCart(){
  document.getElementById('cart-items').innerHTML=cart.map((c,i)=>`
    <div class="cart-item"><span>${c.name}</span><span>${fmt(c.price)} <button onclick="cart.splice(${i},1);renderCart();updateCartTotal()" style="background:none;border:none;color:var(--red);cursor:pointer">✕</button></span></div>`).join('');
}

function addPay(){
  const t=document.getElementById('p-type').value;
  const v=parseFloat(document.getElementById('p-val').value)||0;
  if(v>0){ multiPayments.push({type:t, value:v}); document.getElementById('p-val').value=''; renderPays(); }
}
function renderPays(){
  const icons={dinheiro:'💵',cartao:'💳',pix:'📱'};
  document.getElementById('p-list').innerHTML=multiPayments.map((p,i)=>`
    <div class="cart-item"><span>${icons[p.type]} ${p.type.toUpperCase()}</span><span>${fmt(p.value)} <button onclick="multiPayments.splice(${i},1);renderPays()" style="background:none;border:none;color:var(--red);cursor:pointer">✕</button></span></div>`).join('');
}

function updateCartTotal(){ document.getElementById('t-val').textContent=fmt(cart.reduce((s,c)=>s+c.price,0)); }

function saveOrder(){
  const n=document.getElementById('c-name').value.trim();
  if(!n || !cart.length) return alert('Informe o cliente e adicione itens');
  const total=cart.reduce((s,c)=>s+c.price,0);
  const tableId = orderType==='mesa' ? parseInt(document.getElementById('c-table').value) : null;
  const os=S.get('pp_orders',[]);
  os.push({id:os.length+1, client:n, total, items:[...cart], type:orderType, tableId, payment:orderType==='mesa'?'Aberto':[...multiPayments], status:'pending', date:now()});
  S.set('pp_orders',os); alert('Pedido Criado!'); navigate('orders');
}

let checkoutPayments=[];
function checkoutOrder(id){
  const o=S.get('pp_orders',[]).find(x=>x.id===id);
  checkoutPayments=Array.isArray(o.payment)?[...o.payment]:[];
  openModal(`<div class="modal">
    <h3>💰 Fechar Comanda — ${o.type==='mesa'?'Mesa '+o.tableId:'Pedido #'+o.id}</h3>
    <div style="background:var(--card2); padding:16px; border-radius:10px; text-align:center; margin-bottom:15px">
      <div style="font-size:12px; color:var(--muted)">Total</div>
      <div style="font-size:28px; font-weight:800; color:var(--red)">${fmt(o.total)}</div>
    </div>
    <div id="chk-pay-list"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 40px; gap:4px; margin:10px 0">
      <select id="chk-pay-type"><option value="dinheiro">💵 Dinheiro</option><option value="cartao">💳 Cartão</option><option value="pix">📱 Pix</option></select>
      <input id="chk-pay-val" type="number" step="0.01" placeholder="Valor">
      <button class="btn btn-green btn-xs" onclick="addChkPay(${o.total})">+</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-blue" onclick="printOrder(${o.id})">🖨️ Imprimir</button>
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="finishOrder(${o.id})">Concluir</button>
    </div>
  </div>`);
  renderChkPays();
}
function addChkPay(total){
  const type=document.getElementById('chk-pay-type').value;
  const val=parseFloat(document.getElementById('chk-pay-val').value)||0;
  if(val>0){ checkoutPayments.push({type, value:val}); document.getElementById('chk-pay-val').value=''; renderChkPays(); }
}
function renderChkPays(){
  const icons={dinheiro:'💵', cartao:'💳', pix:'📱'};
  document.getElementById('chk-pay-list').innerHTML=checkoutPayments.map((p,i)=>`
    <div class="cart-item"><span>${icons[p.type]} ${p.type.toUpperCase()}</span><span>${fmt(p.value)} <button onclick="checkoutPayments.splice(${i},1);renderChkPays()" style="background:none;border:none;color:var(--red);cursor:pointer">✕</button></span></div>`).join('');
}
function finishOrder(id){
  const orders=S.get('pp_orders',[]); const o=orders.find(x=>x.id===id);
  o.payment=[...checkoutPayments]; o.status='done'; S.set('pp_orders', orders); closeModal(); navigate(currentPage);
}

function orders(el){
  const all=S.get('pp_orders',[]);
  el.innerHTML=`<div class="page-header"><h2>🧾 Pedidos</h2></div>
  <div class="table-box">
    <table><thead><tr><th>#</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>${all.slice().reverse().map(o=>`<tr>
      <td>#${o.id}</td><td>${o.client}</td><td>${o.type}</td><td>${fmt(o.total)}</td>
      <td>${renderPayIcons(o.payment)}</td><td>${o.status}</td>
      <td><button class="btn btn-xs btn-blue" onclick="printOrder(${o.id})">🖨️</button>
      ${o.status!=='done'?`<button class="btn btn-xs btn-green" onclick="checkoutOrder(${o.id})">💰</button>`:''}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
}

function renderPayIcons(p){
  if(p==='Aberto') return '⏳ Aberto';
  if(!Array.isArray(p)) return '---';
  const icons={dinheiro:'💵', cartao:'💳', pix:'📱'};
  return p.map(x=>icons[x.type]||'').join(' ');
}

function printOrder(id){
  const o=S.get('pp_orders',[]).find(x=>x.id===id);
  const el=document.getElementById('print-section');
  el.innerHTML=`<h2>PIZZARIA PATRÍCIO</h2><p>Pedido #${o.id}</p><p>Cliente: ${o.client}</p><p>Total: ${fmt(o.total)}</p><p>Pagamento: ${renderPayIcons(o.payment)}</p>`;
  window.print();
}

function tables(el){
  const ms=S.get('pp_tables',[]); const os=S.get('pp_orders',[]);
  el.innerHTML=`<div class="mesas-grid">${ms.map(m=>{
    const o=os.find(x=>x.tableId===m.id && x.status!=='done');
    return `<div class="mesa-card ${o?'occupied':'free'}" onclick="${o?`checkoutOrder(${o.id})`:`orderType='mesa';navigate('pdv')`}">
      <div class="mesa-num">Mesa ${m.id}</div><div class="mesa-status">${o?'Ocupada':'Livre'}</div>
    </div>`;
  }).join('')}</div>`;
}

function financeiro(el){
  const os=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=os.reduce((s,o)=>s+o.total,0);
  const pays={dinheiro:0,cartao:0,pix:0};
  os.forEach(o=>{ if(Array.isArray(o.payment)) o.payment.forEach(p=>{ if(pays[p.type]!==undefined) pays[p.type]+=p.value; }); });
  
  el.innerHTML=`<div class="page-header"><h2>💰 Financeiro</h2><button class="btn btn-blue btn-sm" onclick="printFin()">🖨️ Imprimir Relatório</button></div>
    <div class="metric-grid">
      <div class="metric-card"><div class="metric-icon">💵</div><div><div class="metric-val">${fmt(total)}</div><div class="metric-label">Total Geral</div></div></div>
      <div class="metric-card"><div class="metric-icon">💰</div><div><div class="metric-val">${fmt(pays.dinheiro)}</div><div class="metric-label">Dinheiro</div></div></div>
      <div class="metric-card"><div class="metric-icon">💳</div><div><div class="metric-val">${fmt(pays.cartao)}</div><div class="metric-label">Cartão</div></div></div>
      <div class="metric-card"><div class="metric-icon">📱</div><div><div class="metric-val">${fmt(pays.pix)}</div><div class="metric-label">Pix</div></div></div>
    </div>`;
}

function printFin(){
  const os=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=os.reduce((s,o)=>s+o.total,0);
  const el=document.getElementById('print-section');
  el.innerHTML=`<h2>RELATÓRIO FINANCEIRO</h2><p>Data: ${now()}</p><hr><p>Total: ${fmt(total)}</p><p>Pedidos: ${os.length}</p><hr><p>Pizzaria Patrício</p>`;
  window.print();
}

function kitchen(el){ el.innerHTML='<h2>Cozinha</h2>'; }
function delivery(el){ el.innerHTML='<h2>Delivery</h2>'; }
function products(el){ el.innerHTML='<h2>Produtos</h2>'; }
function borders(el){ el.innerHTML='<h2>Bordas</h2>'; }
function clients(el){ el.innerHTML='<h2>Clientes</h2>'; }
function users(el){ el.innerHTML='<h2>Usuários</h2>'; }
function settings(el){ el.innerHTML='<h2>Configurações</h2>'; }
function account(el){ el.innerHTML='<h2>Conta</h2>'; }

initData();
</script>
</body>
</html>

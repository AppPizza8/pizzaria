<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Patrício</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--sidebar:#161b22;--card:#1c2333;--card2:#21262d;
  --border:#30363d;--red:#e63946;--red2:#c1121f;--green:#2ea043;
  --blue:#1f6feb;--orange:#fb8500;--purple:#8b5cf6;--text:#e6edf3;
  --muted:#8b949e;--yellow:#f0c000;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* ===== LOGIN ===== */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d1117 0%,#1c1f2e 50%,#1a0a0a 100%)}
.login-box{background:var(--card);border:1px solid var(--border);padding:44px 40px;border-radius:16px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,.6);text-align:center}
.login-logo{width:64px;height:64px;background:var(--red);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.login-box input{width:100%;padding:11px 14px;margin-bottom:14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.login-box button:hover{background:var(--red2)}
.login-error{color:var(--red);font-size:13px;margin-top:10px;display:none}

/* ===== APP LAYOUT ===== */
#app{display:none;height:100vh;flex-direction:column}
.app-header{height:56px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;z-index:100}
.app-header .hamburger{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.app-header .hamburger:hover{background:var(--card2);color:var(--text)}
.app-header h2{font-size:18px;font-weight:600;flex:1}
.app-header .hactions{display:flex;align-items:center;gap:10px}
.btn-logout{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);padding:5px 12px;border-radius:20px;font-size:13px}

.app-body{display:flex;flex:1;overflow:hidden}

/* ===== SIDEBAR ===== */
#sidebar{width:220px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;overflow-y:auto;transition:width .25s;flex-shrink:0}
#sidebar.collapsed{width:56px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar-logo .logo-icon{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo .logo-text{font-size:13px;line-height:1.3;overflow:hidden;white-space:nowrap}
.sidebar-logo .logo-text strong{display:block;font-size:14px}
.sidebar-logo .logo-text span{color:var(--muted);font-size:11px}
.nav-section{padding:0 12px;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;padding:8px 8px 4px;overflow:hidden;white-space:nowrap}
.nav-btn{width:100%;background:none;border:none;color:var(--muted);text-align:left;padding:9px 10px;cursor:pointer;font-size:13px;border-radius:8px;display:flex;align-items:center;gap:10px;transition:.15s;white-space:nowrap;overflow:hidden;position:relative}
.nav-btn:hover{background:var(--card2);color:var(--text)}
.nav-btn.active{background:rgba(230,57,70,.15);color:var(--red);font-weight:600}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px}

/* ===== MAIN ===== */
#main-content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-header h2{font-size:22px;font-weight:700}

/* ===== CARDS & METRICS ===== */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;transition:.2s}
.metric-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.metric-val{font-size:24px;font-weight:700;line-height:1.1}
.metric-label{font-size:12px;color:var(--muted);margin-top:2px}

.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.chart-box h3{font-size:15px;margin-bottom:16px}

/* ===== TABLES ===== */
.table-box{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--card2);padding:11px 16px;text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}

/* ===== BUTTONS ===== */
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-gray{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-sm{padding:5px 10px;font-size:12px}

/* ===== PDV ===== */
.pdv-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;min-height:calc(100vh - 160px)}
.pdv-products{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.pdv-cart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.product-search{width:100%;padding:10px 14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:14px}
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.cat-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:12px;transition:.15s}
.cat-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.product-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;text-align:center}
.pc-name{font-size:13px;font-weight:600;margin:6px 0 4px}
.pc-price{font-size:12px;color:var(--red)}

.cart-items{flex:1;overflow-y:auto;margin-bottom:14px}
.cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.cart-total-row.big{font-size:18px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:10px}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:480px;max-width:95%}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ===== TABLES GRID ===== */
.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.mesa-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer}
.mesa-card.occupied{border-color:var(--orange);background:rgba(251,133,0,.05)}
.mesa-card.free{border-color:var(--green);background:rgba(46,160,67,.05)}
.mesa-num{font-size:18px;font-weight:800}

/* ===== PRINT ===== */
@media print {
  body * { visibility: hidden; }
  #print-section, #print-section * { visibility: visible; }
  #print-section { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; padding: 20px; display: block !important; }
}
#print-section { display: none; color: #000; }

.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-pending{background:rgba(240,192,0,.15);color:var(--yellow)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🍕</div>
    <h1>Pizzaria Patrício</h1>
    <input id="login-user" placeholder="Usuário" value="admin">
    <input id="login-pass" type="password" placeholder="Senha" value="pizza123">
    <button onclick="doLogin()">Entrar</button>
    <div id="login-error" class="login-error">Erro no login</div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <h2 id="page-title">Dashboard</h2>
    <div class="hactions">
      <div class="user-chip"><span id="header-name">Admin</span></div>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <div class="app-body">
    <nav id="sidebar"><div id="nav-items"></div></nav>
    <main id="main-content"></main>
  </div>
</div>
<div id="print-section"></div>

<script>
// --- STORAGE ---
const S = {
  get:(k,d)=>JSON.parse(localStorage.getItem(k))??d,
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};

function initData(){
  if(!S.get('pp_users')) S.set('pp_users', [{id:1,username:'admin',password:'pizza123',name:'Admin',role:'admin',active:true}]);
  if(!S.get('pp_orders')) S.set('pp_orders', []);
  if(!S.get('pp_tables')) S.set('pp_tables', Array.from({length:12},(_,i)=>({id:i+1})));
  if(!S.get('pp_products')) S.set('pp_products', [{id:1,name:'Calabresa',category:'Pizza',active:true,price:48},{id:2,name:'Coca 2L',category:'Bebida',active:true,price:12}]);
}

// --- AUTH ---
let currentUser = null;
function doLogin(){
  const u=document.getElementById('login-user').value;
  const p=document.getElementById('login-pass').value;
  const user=S.get('pp_users',[]).find(x=>x.username===u && x.password===p);
  if(!user) return alert('Erro');
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  buildSidebar(); navigate('dashboard');
}
function doLogout(){ location.reload(); }

// --- NAV ---
let currentPage = '';
const PAGES = {
  dashboard: {icon:'📊',label:'Dashboard'},
  pdv: {icon:'🖥️',label:'PDV'},
  orders: {icon:'🧾',label:'Pedidos'},
  tables: {icon:'🪑',label:'Mesas'},
  financeiro: {icon:'💰',label:'Financeiro'}
};
function buildSidebar(){
  let h='';
  Object.entries(PAGES).forEach(([id,p])=>{
    h+=`<button class="nav-btn" onclick="navigate('${id}')"><span>${p.icon}</span> ${p.label}</button>`;
  });
  document.getElementById('nav-items').innerHTML=h;
}
function navigate(p){
  currentPage=id=p;
  document.getElementById('page-title').textContent=PAGES[p].label;
  const el=document.getElementById('main-content');
  window[p](el);
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); }

// --- HELPERS ---
const fmt = v => 'R$ ' + Number(v||0).toFixed(2);
const now = () => new Date().toLocaleString('pt-BR');
function openModal(h){
  const d=document.createElement('div'); d.className='modal-overlay'; d.innerHTML=h;
  d.onclick=e=>{if(e.target===d) closeModal();};
  document.body.appendChild(d);
}
function closeModal(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.remove()); }

// --- PAGES ---
function dashboard(el){
  const os=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=os.reduce((s,o)=>s+o.total,0);
  el.innerHTML=`<div class="metric-grid">
    <div class="metric-card"><div class="metric-val">${fmt(total)}</div><div class="metric-label">Vendas Hoje</div></div>
    <div class="metric-card"><div class="metric-val">${os.length}</div><div class="metric-label">Pedidos Finalizados</div></div>
  </div>`;
}

let cart=[];
let orderType='delivery';
let multiPayments=[];

function pdv(el){
  cart=[]; multiPayments=[];
  const prods=S.get('pp_products',[]);
  el.innerHTML=`<div class="pdv-layout">
    <div class="pdv-products">
      <div class="product-grid">${prods.map(p=>`<div class="product-card" onclick="addToCart(${p.id})"><strong>${p.name}</strong><br>${fmt(p.price)}</div>`).join('')}</div>
    </div>
    <div class="pdv-cart">
      <div style="display:flex;gap:4px;margin-bottom:10px">
        <button class="btn ${orderType==='delivery'?'btn-red':'btn-gray'}" onclick="orderType='delivery';navigate('pdv')">Delivery</button>
        <button class="btn ${orderType==='mesa'?'btn-red':'btn-gray'}" onclick="orderType='mesa';navigate('pdv')">Mesa</button>
      </div>
      <input id="c-name" class="product-search" placeholder="Cliente">
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-total-row big"><span>Total</span><span id="t-val">R$ 0,00</span></div>
      <div id="pay-area" style="display:${orderType==='mesa'?'none':'block'}">
        <div id="p-list"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 40px;gap:4px;margin-top:10px">
          <select id="p-type"><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="pix">Pix</option></select>
          <input id="p-val" type="number" step="0.01" placeholder="Valor">
          <button class="btn btn-green" onclick="addPay()">+</button>
        </div>
      </div>
      <button class="btn btn-red" style="width:100%;margin-top:10px" onclick="saveOrder()">Finalizar Pedido</button>
    </div>
  </div>`;
}

function addToCart(id){
  const p=S.get('pp_products',[]).find(x=>x.id===id);
  cart.push({...p}); renderCart();
}
function renderCart(){
  document.getElementById('cart-items').innerHTML=cart.map((c,i)=>`<div class="cart-item"><span>${c.name}</span><span>${fmt(c.price)} <button onclick="cart.splice(${i},1);renderCart()">✕</button></span></div>`).join('');
  const t=cart.reduce((s,c)=>s+c.price,0);
  document.getElementById('t-val').textContent=fmt(t);
}
function addPay(){
  const t=document.getElementById('p-type').value;
  const v=parseFloat(document.getElementById('p-val').value)||0;
  if(v>0){ multiPayments.push({type:t,val:v}); document.getElementById('p-val').value=''; renderPays(); }
}
function renderPaymentsGeneric(list, listId){
  const icons={dinheiro:'💵',cartao:'💳',pix:'📱'};
  document.getElementById(listId).innerHTML=list.map((p,i)=>`<div class="cart-item"><span>${icons[p.type]} ${p.type}</span><span>${fmt(p.val)} <button onclick="removePayGeneric(${i},'${listId}')">✕</button></span></div>`).join('');
}
function renderPays(){ renderPaymentsGeneric(multiPayments, 'p-list'); }
window.removePayGeneric=(i, id)=>{
  if(id==='p-list'){ multiPayments.splice(i,1); renderPays(); }
  else { checkoutPayments.splice(i,1); renderPaysCheckout(); }
};

function saveOrder(){
  const n=document.getElementById('c-name').value;
  if(!n || !cart.length) return alert('Dados incompletos');
  const os=S.get('pp_orders',[]);
  const total=cart.reduce((s,c)=>s+c.price,0);
  os.push({id:os.length+1, client:n, total, items:[...cart], type:orderType, payment:orderType==='mesa'?'Aberto':[...multiPayments], status:'pending', date:now()});
  S.set('pp_orders',os); alert('Sucesso'); navigate('orders');
}

function orders(el){
  const os=S.get('pp_orders',[]);
  el.innerHTML=`<div class="table-box"><table>
    <thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>${os.reverse().map(o=>`<tr><td>#${o.id}</td><td>${o.client}</td><td>${fmt(o.total)}</td><td>${o.status}</td>
      <td><button class="btn btn-xs btn-blue" onclick="printOrder(${o.id})">🖨️</button>
      ${o.status!=='done'?`<button class="btn btn-xs btn-green" onclick="checkoutOrder(${o.id})">💰</button>`:''}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

let checkoutPayments=[];
function checkoutOrder(id){
  const o=S.get('pp_orders',[]).find(x=>x.id===id);
  checkoutPayments=[];
  openModal(`<div class="modal">
    <h3>Fechar Pedido #${o.id}</h3>
    <div style="text-align:center;margin:15px 0"><div style="font-size:24px;font-weight:800;color:var(--red)">${fmt(o.total)}</div></div>
    <div id="p-list-chk"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 40px;gap:4px;margin-top:10px">
      <select id="pc-type"><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="pix">Pix</option></select>
      <input id="pc-val" type="number" step="0.01" placeholder="Valor">
      <button class="btn btn-green" onclick="addPayCheckout()">+</button>
    </div>
    <div class="modal-footer"><button class="btn btn-gray" onclick="closeModal()">Sair</button><button class="btn btn-green" onclick="finishOrder(${o.id})">Concluir</button></div>
  </div>`);
}
function addPayCheckout(){
  const t=document.getElementById('pc-type').value;
  const v=parseFloat(document.getElementById('pc-val').value)||0;
  if(v>0){ checkoutPayments.push({type:t,val:v}); document.getElementById('pc-val').value=''; renderPaysCheckout(); }
}
function renderPaysCheckout(){ renderPaymentsGeneric(checkoutPayments, 'p-list-chk'); }
function finishOrder(id){
  const os=S.get('pp_orders',[]); const o=os.find(x=>x.id===id);
  o.payment=[...checkoutPayments]; o.status='done'; S.set('pp_orders',os); closeModal(); navigate(currentPage);
}

function tables(el){
  const ts=S.get('pp_tables',[]); const os=S.get('pp_orders',[]);
  el.innerHTML=`<div class="mesas-grid">${ts.map(t=>{
    const o=os.find(x=>x.type==='mesa' && x.status!=='done');
    return `<div class="mesa-card ${o?'occupied':'free'}" onclick="${o?`checkoutOrder(${o.id})`:`navigate('pdv')`}">Mesa ${t.id}</div>`;
  }).join('')}</div>`;
}

function financeiro(el){
  const os=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=os.reduce((s,o)=>s+o.total,0);
  const pays={dinheiro:0,cartao:0,pix:0};
  os.forEach(o=>o.payment.forEach(p=>{ if(pays[p.type]!==undefined) pays[p.type]+=p.val; }));
  el.innerHTML=`<div class="page-header"><h2>Financeiro</h2><button class="btn btn-blue" onclick="printFin()">Imprimir Relatório</button></div>
    <div class="metric-grid">
      <div class="metric-card"><div class="metric-val">${fmt(total)}</div><div class="metric-label">Total Geral</div></div>
      <div class="metric-card"><div class="metric-val">${fmt(pays.dinheiro)}</div><div class="metric-label">Dinheiro</div></div>
      <div class="metric-card"><div class="metric-val">${fmt(pays.cartao)}</div><div class="metric-label">Cartão</div></div>
      <div class="metric-card"><div class="metric-val">${fmt(pays.pix)}</div><div class="metric-label">Pix</div></div>
    </div>`;
}

function printOrder(id){
  const o=S.get('pp_orders',[]).find(x=>x.id===id);
  const pr=document.getElementById('print-section');
  pr.innerHTML=`<h2>PIZZARIA PATRÍCIO</h2><p>Pedido #${o.id}</p><p>Cliente: ${o.client}</p><p>Total: ${fmt(o.total)}</p>`;
  window.print();
}
function printFin(){
  const os=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=os.reduce((s,o)=>s+o.total,0);
  const pr=document.getElementById('print-section');
  pr.innerHTML=`<h2>RELATÓRIO FINANCEIRO</h2><p>Total: ${fmt(total)}</p><p>Data: ${now()}</p>`;
  window.print();
}

initData();
</script>
</body>
</html>

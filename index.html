<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Patrício</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--sidebar:#161b22;--card:#1c2333;--card2:#21262d;
  --border:#30363d;--red:#e63946;--red2:#c1121f;--green:#2ea043;
  --blue:#1f6feb;--orange:#fb8500;--purple:#8b5cf6;--text:#e6edf3;
  --muted:#8b949e;--yellow:#f0c000;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* ===== LOGIN ===== */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d1117 0%,#1c1f2e 50%,#1a0a0a 100%)}
.login-box{background:var(--card);border:1px solid var(--border);padding:44px 40px;border-radius:16px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,.6);text-align:center}
.login-logo{width:64px;height:64px;background:var(--red);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.login-box input{width:100%;padding:11px 14px;margin-bottom:14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.login-box button:hover{background:var(--red2)}
.login-error{color:var(--red);font-size:13px;margin-top:10px;display:none}

/* ===== APP LAYOUT ===== */
#app{display:none;height:100vh;flex-direction:column}
.app-header{height:56px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;z-index:100}
.app-header .hamburger{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.app-header .hamburger:hover{background:var(--card2);color:var(--text)}
.app-header h2{font-size:18px;font-weight:600;flex:1}
.app-header .hactions{display:flex;align-items:center;gap:10px}
.app-header .hactions .icon-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;border-radius:8px;transition:.2s;position:relative}
.app-header .hactions .icon-btn:hover{background:var(--card2);color:var(--text)}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--red);border-radius:50%}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);padding:5px 12px;border-radius:20px;font-size:13px}
.user-chip .badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.btn-logout{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.app-body{display:flex;flex:1;overflow:hidden}

/* ===== SIDEBAR ===== */
#sidebar{width:190px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;overflow-y:auto;transition:width .25s;flex-shrink:0}
#sidebar.collapsed{width:56px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar-logo .logo-icon{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo .logo-text{font-size:13px;line-height:1.3;overflow:hidden;white-space:nowrap}
.sidebar-logo .logo-text strong{display:block;font-size:14px}
.sidebar-logo .logo-text span{color:var(--muted);font-size:11px}
.nav-section{padding:0 12px;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;padding:8px 8px 4px;overflow:hidden;white-space:nowrap}
#sidebar.collapsed .nav-section-label{opacity:0}
.nav-btn{width:100%;background:none;border:none;color:var(--muted);text-align:left;padding:9px 10px;cursor:pointer;font-size:13px;border-radius:8px;display:flex;align-items:center;gap:10px;transition:.15s;white-space:nowrap;overflow:hidden;position:relative}
.nav-btn:hover{background:var(--card2);color:var(--text)}
.nav-btn.active{background:rgba(230,57,70,.15);color:var(--red);font-weight:600}
.nav-btn .nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.nav-btn .nav-label{overflow:hidden}
#sidebar.collapsed .nav-label{display:none}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
#sidebar.collapsed .nav-badge{display:none}

/* ===== MAIN ===== */
#main-content{flex:1;min-width:0;overflow-y:auto;padding:24px;background:var(--bg)}
.page{display:none}
.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.page-header h2{font-size:22px;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:22px}

/* ===== CARDS ===== */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;transition:.2s}
.metric-card:hover{border-color:#444;transform:translateY(-1px)}
.metric-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.metric-card .metric-val{font-size:24px;font-weight:700;line-height:1.1}
.metric-card .metric-label{font-size:12px;color:var(--muted);margin-top:2px}
.metric-card .metric-sub{font-size:11px;margin-top:3px}

/* ===== CHARTS ===== */
.chart-row{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.chart-box h3{font-size:15px;margin-bottom:16px}
.ranking-list{display:flex;flex-direction:column;gap:10px}
.rank-item{display:flex;align-items:center;gap:10px}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-num.gold{background:#f0c000;color:#000}
.rank-num.silver{background:#8b949e}
.rank-num.bronze{background:#fb8500}
.rank-bar-wrap{flex:1}
.rank-name{font-size:13px;margin-bottom:3px}
.rank-bar{height:6px;background:var(--red);border-radius:3px;opacity:.8}
.rank-count{font-size:12px;color:var(--muted);flex-shrink:0}

/* ===== TABLES ===== */
.table-box{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--card2);padding:11px 16px;text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* ===== BUTTONS ===== */
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red2)}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-gray{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-gray:hover{background:#2d333b}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}

/* ===== FORMS ===== */
.form-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:.2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--red)}
.form-row select option{background:var(--card)}
.form-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ===== STATUS ===== */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;gap:4px}
.badge-pending{background:rgba(240,192,0,.15);color:var(--yellow);border:1px solid rgba(240,192,0,.3)}
.badge-making{background:rgba(31,111,235,.15);color:#58a6ff;border:1px solid rgba(31,111,235,.3)}
.badge-delivery{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3)}
.badge-ready{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.badge-done{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.badge-cancelled{background:rgba(230,57,70,.15);color:var(--red);border:1px solid rgba(230,57,70,.3)}
.badge-active{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.badge-inactive{background:rgba(139,148,158,.15);color:var(--muted);border:1px solid rgba(139,148,158,.2)}
.badge-dine{background:rgba(251,133,0,.15);color:var(--orange);border:1px solid rgba(251,133,0,.3)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.modal-lg{width:700px}

/* ===== PDV ===== */
.pdv-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;min-height:calc(100vh - 160px)}
.pdv-products{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.pdv-cart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.product-search{width:100%;padding:10px 14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:14px}
.product-search:focus{border-color:var(--red)}
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.cat-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.cat-tab.active,.cat-tab:hover{background:var(--red);color:#fff;border-color:var(--red)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.product-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;transition:.15s;text-align:center}
.product-card:hover{border-color:var(--red);transform:translateY(-2px)}
.product-card .pc-icon{font-size:28px;margin-bottom:6px}
.product-card .pc-name{font-size:13px;font-weight:600;margin-bottom:4px}
.product-card .pc-price{font-size:12px;color:var(--red)}
.product-card .pc-sizes{font-size:10px;color:var(--muted);margin-top:2px}

.cart-items{flex:1;overflow-y:auto;margin-bottom:14px}
.cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600}
.cart-item-sub{font-size:11px;color:var(--muted);margin-top:1px}
.cart-item-price{font-size:13px;font-weight:700;color:var(--red);flex-shrink:0}
.cart-item-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;transition:.15s}
.cart-item-remove:hover{color:var(--red);background:rgba(230,57,70,.1)}
.cart-total-box{border-top:1px solid var(--border);padding-top:14px}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
.cart-total-row.big{font-size:18px;font-weight:700;color:var(--text)}
.cart-obs{width:100%;padding:8px 10px;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;resize:none;margin-bottom:12px}
.payment-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.pay-btn{padding:8px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s;font-weight:600}
.pay-btn.active,.pay-btn:hover{border-color:var(--green);color:var(--green);background:rgba(46,160,67,.1)}

/* ===== KITCHEN ===== */
.kitchen-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.kitchen-col-title{font-size:13px;font-weight:700;margin-bottom:10px;padding:8px 12px;border-radius:8px;text-align:center}
.kc-pending{background:rgba(240,192,0,.1);color:var(--yellow)}
.kc-making{background:rgba(31,111,235,.1);color:#58a6ff}
.kc-ready{background:rgba(46,160,67,.1);color:#3fb950}
.kitchen-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.kitchen-card.urgent{border-color:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.3)}50%{box-shadow:0 0 0 6px rgba(230,57,70,0)}}
.kitchen-card h4{font-size:14px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.kitchen-card .kc-items{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.kitchen-card .kc-time{font-size:11px;color:var(--muted);margin-bottom:8px}

/* ===== SIZES CONFIG ===== */
.size-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px;background:#0d1117;border-radius:8px;border:1px solid var(--border)}
.size-row input{flex:1;padding:6px 10px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.size-row input:focus{border-color:var(--red)}
.size-row .remove-size{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;transition:.15s}
.size-row .remove-size:hover{color:var(--red)}

	/* ===== DELIVERY CARDS ===== */
	.delivery-cards{display:flex;flex-direction:column;gap:10px}

	/* ===== PRINT STYLES ===== */
	@media print {
	  body * { visibility: hidden; }
	  #print-section, #print-section * { visibility: visible; }
	  #print-section { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; padding: 10px; font-family: 'Courier New', Courier, monospace; display: block !important; }
	  .no-print { display: none !important; }
	}
	#print-section { display: none; }
	#print-section h2 { text-align: center; font-size: 18px; margin-bottom: 5px; }
	#print-section p { font-size: 12px; margin: 2px 0; }
	#print-section table { width: 100%; border-top: 1px dashed #000; border-bottom: 1px dashed #000; margin: 10px 0; border-collapse: collapse; }
	#print-section th { font-size: 11px; text-align: left; background: none; color: #000; padding: 5px 0; border-bottom: 1px dashed #000; }
	#print-section td { font-size: 11px; padding: 3px 0; border: none; color: #000; }
	#print-section .total-row { font-size: 14px; font-weight: bold; text-align: right; margin-top: 10px; }
	#print-section .footer { text-align: center; font-size: 10px; margin-top: 20px; border-top: 1px dashed #000; padding-top: 10px; }
.delivery-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;align-items:center;gap:14px}
.delivery-card.delivered{opacity:.6}
.delivery-card .dc-num{font-size:20px;font-weight:800;color:var(--red);min-width:36px}
.delivery-card .dc-info{flex:1}
.delivery-card .dc-name{font-size:14px;font-weight:600}
.delivery-card .dc-addr{font-size:12px;color:var(--muted);margin-top:2px}
.delivery-card .dc-items{font-size:12px;color:var(--muted)}

/* ===== TABLES (mesas) ===== */
.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mesa-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s}
.mesa-card:hover{transform:translateY(-2px)}
.mesa-card.occupied{border-color:var(--red);background:rgba(230,57,70,.08)}
.mesa-card.free{border-color:var(--green)}
.mesa-card .mesa-num{font-size:22px;font-weight:800}
.mesa-card .mesa-status{font-size:11px;color:var(--muted);margin-top:4px}
.mesa-card.occupied .mesa-status{color:var(--red)}
.mesa-card.free .mesa-status{color:var(--green)}

/* ===== ALERT ===== */
.alert{padding:10px 16px;border-radius:8px;font-size:13px;display:none;margin-bottom:12px}
.alert-success{background:rgba(46,160,67,.15);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
.alert-error{background:rgba(230,57,70,.15);color:var(--red);border:1px solid rgba(230,57,70,.3)}

/* ===== ACTIONS ===== */
.row-actions{display:flex;gap:6px;align-items:center}
.orders-table{width:100%;table-layout:fixed}
.orders-table th,.orders-table td{padding:10px 10px;font-size:12px}
.orders-table th:nth-child(1){width:4%}
.orders-table th:nth-child(2){width:10%}
.orders-table th:nth-child(3){width:9%}
.orders-table th:nth-child(4){width:8%}
.orders-table th:nth-child(5){width:15%}
.orders-table th:nth-child(6){width:7%}
.orders-table th:nth-child(7){width:9%}
.orders-table th:nth-child(8){width:11%}
.orders-table th:nth-child(9){width:12%}
.orders-table th:nth-child(10){width:15%}
.orders-table td:nth-child(5){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orders-table td:nth-child(10){white-space:nowrap;overflow:hidden}
.orders-table .row-actions{gap:4px;flex-wrap:nowrap}
.orders-table .row-actions .btn-xs{padding:3px 6px;font-size:10px;gap:3px}
.finance-shell{max-width:1400px}
.finance-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.finance-section h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.finance-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.finance-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.finance-mini{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px}
.finance-mini .finance-mini-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.finance-mini .finance-mini-value{font-size:18px;font-weight:700}
.finance-progress{height:8px;background:#0d1117;border-radius:10px;overflow:hidden;margin:8px 0 6px}
.finance-progress>span{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .2s}
.finance-tag{display:inline-flex;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(31,111,235,.15);color:#58a6ff}
.finance-scroll{overflow-x:auto}
.finance-scroll table{min-width:640px}
.finance-action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.finance-muted{font-size:12px;color:var(--muted)}
@media(max-width:900px){.finance-grid-2,.finance-grid-3{grid-template-columns:1fr}.finance-shell{max-width:100%}.finance-section{padding:14px}.finance-scroll table{min-width:600px}}

@media(max-width:900px){
  .chart-row{grid-template-columns:1fr}
  .pdv-layout{grid-template-columns:1fr}
  .kitchen-cols{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  #sidebar{width:56px}
  .nav-label{display:none}
  .nav-badge{display:none}
  #main-content{padding:14px}

const S = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set:(k,v)=>{
    localStorage.setItem(k,JSON.stringify(v));
    if(typeof firebaseDb!=='undefined'&&firebaseDb&&useFirebase){
      try{firebaseDb.ref('pizzaria/'+k).set(v);}catch(e){console.warn('Sync error',e);}
    }
  }
};

// ============================================================
// FIREBASE SYNC — opcional. Ativa para multi-dispositivo
// ============================================================
let firebaseDb=null,useFirebase=false,lastSyncAt=0;
const SYNC_KEYS=['pp_users','pp_clients','pp_products','pp_borders','pp_orders','pp_tables','pp_movements','pp_v2','pp_finance_settings','pp_finance_movements','pp_finance_accounts','pp_finance_purchases','pp_finance_reserves','pp_finance_closings','pp_promotions'];

function setupFirebase(config){
  try{
    firebase.initializeApp(config);
    firebaseDb=firebase.database();
    useFirebase=true;
    SYNC_KEYS.forEach(k=>{
      firebaseDb.ref('pizzaria/'+k).on('value',snap=>{
        const v=snap.val();
        if(v!==null&&v!==undefined){
          localStorage.setItem(k,JSON.stringify(v));
          lastSyncAt=Date.now();
          updateSyncUI('ok');
          onRemoteChange(k);
        }
      });
    });
    firebaseDb.ref('.info/connected').on('value',snap=>{
      updateSyncUI(snap.val()?'ok':'off');
    });
    // Primeira vez: subir localStorage para Firebase se estiver vazio
    firebaseDb.ref('pizzaria').once('value',snap=>{
      if(!snap.exists()){
        SYNC_KEYS.forEach(k=>{
          const local=localStorage.getItem(k);
          if(local) firebaseDb.ref('pizzaria/'+k).set(JSON.parse(local));
        });
      }
    });
    return true;
  }catch(e){console.error('Firebase setup error',e);return false;}
}

function onRemoteChange(key){
  const page=currentPage||'dashboard';
  const el=document.getElementById('content-area');
  if(key==='pp_orders'){
    // Recarregar badges e página se houver mudança nos pedidos
    buildSidebar();
    if(['orders','pdv','dashboard','kitchen','delivery','tables'].includes(page)) navigate(page);
  }
  else if(key==='pp_products'&&page==='pdv')navigate('pdv');
  else if(key==='pp_borders'&&page==='pdv')navigate('pdv');
  else if(key==='pp_tables'&&page==='tables')navigate('tables');
  else if(key==='pp_clients'&&page==='pdv')navigate('pdv');
  if(typeof buildSidebar==='function')buildSidebar();
}

function updateSyncUI(state){
  const el=document.getElementById('sync-status');
  if(!el)return;
  if(!useFirebase){el.innerHTML='<span style="color:var(--muted);font-size:11px">📴 Modo local</span>';return;}
  el.innerHTML=state==='ok'?'<span style="color:#2ea043;font-size:11px">🟢 Sincronizado</span>':'<span style="color:#fb8500;font-size:11px">🟡 Reconectando...</span>';
}

function buildSidebar(){
  const pages = ROLE_PAGES[currentUser.role]||[];
  const sections = {};
  pages.forEach(p=>{
    const info=ALL_PAGES[p];
    if(!sections[info.section]) sections[info.section]=[];
    sections[info.section].push(p);
  });
  let html='';
  Object.entries(sections).forEach(([sec,ps])=>{
    html+=`<div class="nav-section"><div class="nav-section-label">${sec}</div>`;
    ps.forEach(p=>{
      const info=ALL_PAGES[p];
      const badge=info.badge?getBadgeCount(info.badge):'';
      html+=`<button id="nav-${p}" class="nav-btn" onclick="navigate('${p}')">
        <span class="nav-icon">${info.icon}</span>
        <span class="nav-label">${info.label}</span>
        ${badge>0?`<span class="nav-badge">${badge}</span>`:''}
      </button>`;
    });
    html+='</div>';
  });
  document.getElementById('nav-items').innerHTML=html;
}

function nextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1;}
function fmt(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',');}
function now(){return new Date().toLocaleString('pt-BR');}
function isPizzaProduct(p){
  return !!p && (p.category==='Pizza'||['Tradicionais','Clássicas','Especiais'].includes(p.category));
}
function getProductSize(p, sizeName){
  return p?.sizes?.find(s=>s.name===sizeName)||p?.sizes?.[0]||{name:sizeName||'-',price:0};
}
function itemDisplayName(item){
  if(item?.isHalfHalf){
    const first=item.flavors?.[0]?.name||item.name||'Sabor 1';
    const second=item.flavors?.[1]?.name||item.halfFlavorName||'Sabor 2';
    return `½ ${first} + ½ ${second}`;
  }
  return item?.name||'Item';
}
function paymentContext(receivedId){
  const checkout=receivedId==='chk-received';
  const list=checkout?checkoutPayments:multiPayments;
  const total=checkout?checkoutTotal:cart.reduce((s,c)=>s+c.price,0);
  const paid=list.reduce((s,p)=>s+(Number(p.value)||0),0);
  return {total,paid,remaining:Math.max(0,total-paid)};
}
function toggleChangeCalc(typeId, calcId) {
  const type = document.getElementById(typeId)?.value;
  const el = document.getElementById(calcId);
  if(el) el.style.display = type === 'dinheiro' ? 'block' : 'none';
  const checkout=typeId==='chk-pay-type';
  const receivedId=checkout?'chk-received':'pdv-received';
  const valueId=checkout?'chk-pay-val':'add-pay-val';
  const displayId=checkout?'chk-change-val':'pdv-change-val';
  if(type==='dinheiro') updateChange(receivedId,valueId,displayId);
  else {
    const receivedEl=document.getElementById(receivedId);
    const displayEl=document.getElementById(displayId);
    if(receivedEl) receivedEl.value='';
    if(displayEl) displayEl.textContent=fmt(0);
  }
}
function updateChange(receivedId, valueId, displayId) {
  const receivedEl=document.getElementById(receivedId);
  const valueEl=document.getElementById(valueId);
  const displayEl=document.getElementById(displayId);
  if(!receivedEl||!valueEl||!displayEl)return;
  const rec = parseFloat(receivedEl.value) || 0;
  let val = parseFloat(valueEl.value) || 0;
  const ctx=paymentContext(receivedId);
  if(rec>0 && val<=0){
    val=ctx.remaining;
    if(ctx.remaining>0) valueEl.value=val.toFixed(2);
  }
  const payable=ctx.remaining>0?Math.min(val,ctx.remaining):0;
  const change=ctx.remaining>0?Math.max(0,rec-payable):0;
  displayEl.textContent = fmt(change);
  if(receivedId==='chk-received') window.currentCheckoutChange=change;
  else window.currentPdvChange=change;
}

function syncPaymentAmount(prefix){
  const typeId=prefix==='pdv'?'add-pay-type':'chk-pay-type';
  const valId=prefix==='pdv'?'add-pay-val':'chk-pay-val';
  const receivedId=prefix==='pdv'?'pdv-received':'chk-received';
  const displayId=prefix==='pdv'?'pdv-change-val':'chk-change-val';
  const type=document.getElementById(typeId)?.value;
  const valueEl=document.getElementById(valId);
  const receivedEl=document.getElementById(receivedId);
  if(!valueEl||!receivedEl)return;
  if(type==='dinheiro'&&valueEl.value&&!receivedEl.value) receivedEl.value=valueEl.value;
  updateChange(receivedId,valId,displayId);
}
function addPaymentRow(containerId = 'multi-pay-list', valId = 'add-pay-val', typeId = 'add-pay-type', remainId = 'pay-remain', targetList = multiPayments, totalToCover = null) {
  const type = document.getElementById(typeId).value;
  const val = parseFloat(document.getElementById(valId).value) || 0;
  if(val <= 0) return;
  const receivedId=containerId==='multi-pay-list'?'pdv-received':'chk-received';
  const received=type==='dinheiro'?(parseFloat(document.getElementById(receivedId)?.value)||val):val;
  const currentPaid=targetList.reduce((s,p)=>s+(Number(p.value)||0),0);
  const total=totalToCover!==null&&totalToCover!==undefined?totalToCover:(containerId==='checkout-pay-list'?checkoutTotal:cart.reduce((s,c)=>s+c.price,0));
  const remainingBefore=Math.max(0,total-currentPaid);
  const appliedValue=Math.min(val,remainingBefore);
  if(appliedValue<=0)return;
  targetList.push({type, value: appliedValue, received, change:type==='dinheiro'?Math.max(0,received-appliedValue):0});
  document.getElementById(valId).value = '';
  if(containerId === 'multi-pay-list') {
    if(document.getElementById('pdv-received')) document.getElementById('pdv-received').value = '';
    if(document.getElementById('pdv-change-val')) document.getElementById('pdv-change-val').textContent = fmt(0);
  } else {
    if(document.getElementById('chk-received')) document.getElementById('chk-received').value = '';
    if(document.getElementById('chk-change-val')) document.getElementById('chk-change-val').textContent = fmt(0);
  }
  renderMultiPayments(containerId, remainId, targetList, totalToCover);
}

function renderMultiPayments(containerId, remainId, targetList, totalToCover) {
  const total = cart.reduce((s,c)=>s+c.price,0);
  const toCover = totalToCover !== null ? totalToCover : (containerId==='checkout-pay-list'?checkoutTotal:total);
  const paid = targetList.reduce((s,p)=>s+p.value,0);
  const remain = Math.max(0, toCover - paid);
  
  const icons = {dinheiro:'💵', cartao:'💳', pix:'📱'};
  const el = document.getElementById(containerId);
  el.innerHTML = targetList.map((p, i) => `
    <div style="display:flex; justify-content:space-between; font-size:12px; background:var(--card2); padding:5px 8px; border-radius:6px; margin-bottom:4px; border:1px solid var(--border)">

    </div>
  `).join('');
  
  const remEl = document.getElementById(remainId);
  if(remEl) remEl.textContent = `Restante: ${fmt(remain)}`;
}

      <button class="btn btn-gray" onclick="closeLastModal()">Cancelar</button>
      <button class="btn btn-red" onclick="addToCart(${id})">Adicionar ao Carrinho</button>
    </div>
  </div>`);
  updatePizzaOptionPreview('po');
}

function setPizzaOptionMode(mode,prefix){
  const half=mode==='half';
  if(prefix==='po') poHalfHalf=half;
  else apHalfHalf=half;
  const wholeBtn=document.getElementById(`${prefix}-whole-btn`);
  const halfBtn=document.getElementById(`${prefix}-half-btn`);
  const options=document.getElementById(`${prefix}-half-options`);
  if(wholeBtn) wholeBtn.classList.toggle('active',!half);
  if(halfBtn) halfBtn.classList.toggle('active',half);
  if(options) options.style.display=half?'block':'none';
  updatePizzaOptionPreview(prefix);
}
function updatePizzaOptionPreview(prefix){
  const isHalf=prefix==='po'?poHalfHalf:apHalfHalf;
  const sizeEl=document.getElementById(`${prefix}-size`);
  if(!sizeEl)return;
  const borderEl=document.getElementById(`${prefix}-border`);
  const borderPrice=borderEl?parseFloat(borderEl.value)||0:0;
  const selectedSizeName=sizeEl.options[sizeEl.selectedIndex]?.dataset.name||'';
  let basePrice=parseFloat(sizeEl.value)||0;
  let note='';
  if(isHalf){
    const flavor1Id=parseInt(document.getElementById(`${prefix}-half-flavor-1`)?.value);
    const flavor2Id=parseInt(document.getElementById(`${prefix}-half-flavor-2`)?.value);
    const products=S.get('pp_products',[]);
    const flavor1=products.find(x=>x.id===flavor1Id);
    const flavor2=products.find(x=>x.id===flavor2Id);
    const price1=getProductSize(flavor1,selectedSizeName).price;
    const price2=getProductSize(flavor2,selectedSizeName).price;
    basePrice=Math.max(price1,price2);
    note=`Meio a meio: ${flavor1?.name||'Sabor 1'} + ${flavor2?.name||'Sabor 2'} · cobrado pelo maior: ${fmt(basePrice+borderPrice)}`;
  } else {
    note=`Preço da pizza: ${fmt(basePrice+borderPrice)}`;
  }
  const noteEl=document.getElementById(`${prefix}-price-note`);
  if(noteEl) noteEl.textContent=note;
  return {basePrice,borderPrice,sizeName:selectedSizeName};
}
function addToCart(id){
  const p=S.get('pp_products',[]).find(x=>x.id===id);
  if(!p)return;
  const sizeEl=document.getElementById('po-size');
  const sizeName=sizeEl.options[sizeEl.selectedIndex].dataset.name;
  const sizePrice=parseFloat(sizeEl.value);
  const borderEl=document.getElementById('po-border');
  const borderName=borderEl?borderEl.options[borderEl.selectedIndex]?.dataset.name:'';
  const borderPrice=borderEl?parseFloat(borderEl.value)||0:0;
  const qty=Math.max(1,parseInt(document.getElementById('po-qty').value)||1);
  const obs=document.getElementById('po-obs').value.trim();
  let basePrice=sizePrice;
  let flavors=null;
  if(poHalfHalf&&isPizzaProduct(p)){
    const flavor1Id=parseInt(document.getElementById('po-half-flavor-1')?.value);
    const flavor2Id=parseInt(document.getElementById('po-half-flavor-2')?.value);
    if(!flavor1Id||!flavor2Id||flavor1Id===flavor2Id){alert('Escolha dois sabores diferentes para a pizza meio a meio.');return;}
    const products=S.get('pp_products',[]);
    const flavor1=products.find(x=>x.id===flavor1Id);
    const flavor2=products.find(x=>x.id===flavor2Id);
    basePrice=Math.max(getProductSize(flavor1,sizeName).price,getProductSize(flavor2,sizeName).price);
    flavors=[{id:flavor1.id,name:flavor1.name},{id:flavor2.id,name:flavor2.name}];
  }
  const unitPrice=basePrice+borderPrice;
  cart.push({id:p.id,name:p.name,category:p.category,size:sizeName,border:borderName,qty,unitPrice,basePrice,price:unitPrice*qty,obs,isHalfHalf:!!flavors,flavors});
  closeLastModal();
  renderCart();
}

function openPromotionOptions(id){
  const p=S.get('pp_promotions',[]).find(x=>x.id===id);
  if(!p)return;
  openModal(`<div class="modal"><h3>⚡ ${p.name}</h3>${p.description?`<p style="font-size:13px;color:var(--muted);margin-bottom:10px">${p.description}</p>`:''}${p.items?`<div style="background:rgba(240,192,0,.08);border:1px solid rgba(240,192,0,.25);padding:9px;border-radius:7px;font-size:12px;margin-bottom:14px">Itens: ${p.items}</div>`:''}<div class="form-row"><label>Preço promocional</label><div style="font-size:20px;font-weight:700;color:#f0c000">${fmt(p.price)}</div></div><div class="form-row"><label>Quantidade</label><input id="promo-qty" type="number" min="1" value="1"></div><div class="form-row"><label>Observação</label><input id="promo-obs" placeholder="Observação do pedido"></div><div class="modal-footer"><button class="btn btn-gray" onclick="closeLastModal()">Cancelar</button><button class="btn btn-red" onclick="addPromotionToCart(${id})">Adicionar ao Carrinho</button></div></div>`);
}
function addPromotionToCart(id){
  const p=S.get('pp_promotions',[]).find(x=>x.id===id);if(!p)return;
  const qty=Math.max(1,parseInt(document.getElementById('promo-qty')?.value)||1),obs=document.getElementById('promo-obs')?.value.trim()||'',unitPrice=Number(p.price)||0;

function renderCart(){
  const el=document.getElementById('cart-items');
  if(!el)return;
  if(cart.length===0){el.innerHTML='<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:20px">Nenhum item adicionado</p>';updateCartTotal();return;}
  el.innerHTML=cart.map((c,i)=>`
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${c.qty}x ${itemDisplayName(c)}</div>
        <div class="cart-item-sub">${c.size}${c.border&&c.border!=='Sem Borda'?' · Borda '+c.border:''}${c.obs?' · '+c.obs:''}</div>

function removeCart(i){cart.splice(i,1);renderCart();}

function updateCartTotal(){
  const total=cart.reduce((s,c)=>s+c.price,0);

  const tot=document.getElementById('cart-total-val');
  if(sub) sub.textContent=fmt(total);

function setOrderType(type,btn){
  orderType=type;
  btn.parentElement.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const addrRow=document.getElementById('cart-addr-row');
  const tableRow=document.getElementById('cart-table-row');
  const payArea=document.getElementById('pdv-payment-area');
  
  if(addrRow) addrRow.style.display=type==='delivery'?'block':'none';

function setPay(type,btn){
  selectedPayment=type;
  btn.closest('.payment-select').querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function submitOrder(){
  const client=document.getElementById('cart-client')?.value.trim();
  const addr=document.getElementById('cart-addr')?.value.trim();
  const tableId=document.getElementById('cart-table')?.value?(parseInt(document.getElementById('cart-table').value)):null;
  if(!client){alert('Informe o nome do cliente');return;}
  if(cart.length===0){alert('Adicione pelo menos um item');return;}
  if(orderType==='delivery'&&!addr){alert('Informe o endereço de entrega');return;}
  if(orderType==='mesa'&&!tableId){alert('Selecione a mesa');return;}
  
  const total=cart.reduce((s,c)=>s+c.price,0);
  const paid = multiPayments.reduce((s,p)=>s+p.value,0);
  
  if(orderType !== 'mesa' && paid < total) {
    if(!confirm(`O valor pago (${fmt(paid)}) é menor que o total (${fmt(total)}). Deseja continuar mesmo assim?`)) return;
  }

  const orders=S.get('pp_orders',[]);
  const obs=document.getElementById('cart-obs')?.value;
  const newOrder={
    id:nextId(orders),
    client,
    address:addr,
    tableId:orderType==='mesa'?tableId:null,
    type:orderType,
    items:cart.map(c=>({...c})),
    total,
    payment: orderType==='mesa' ? 'Aberto' : (multiPayments.length > 0 ? multiPayments : 'Pendente'),
    obs,
    status:'pending',
    createdAt:now(),
    createdBy:currentUser.username
  };
  
  orders.push(newOrder);
  S.set('pp_orders',orders);
  
  if(orderType==='mesa'&&tableId){
    const tables=S.get('pp_tables',[]);
    const t=tables.find(x=>x.id===tableId);
    if(t){t.status='occupied';t.orderId=newOrder.id;t.openedAt=now();S.set('pp_tables',tables);}
  }
  
  cart=[];
  multiPayments = [];
  buildSidebar();
  alert(`✅ Pedido #${newOrder.id} criado com sucesso!${orderType==='mesa'?' (Mesa '+tableId+')':''}`);
  navigate('orders');
}

function renderOrdersRows(list){

    const payDisp = Array.isArray(o.payment) ? o.payment.map(p=>({dinheiro:'💵',cartao:'💳',pix:'📱'}[p.type]||'')).join('') : (payLabel[o.payment]||'');

    <td class="row-actions">
      ${o.status!=='done'&&o.status!=='cancelled'?(o.status==='ready'||o.status==='delivery'?`<button class="btn btn-green btn-xs" onclick="checkoutOrder(${o.id})">💰 Concluir</button>`:`<button class="btn btn-blue btn-xs" onclick="advanceOrder(${o.id})">Avançar →</button>`):''}
      ${o.status!=='done'&&o.status!=='cancelled'?`<button class="btn btn-xs" style="background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3)" onclick="addItemToOrder(${o.id})">➕</button>`:''}

  }).join('');

function filterOrders(status,btn){
  document.querySelectorAll('.cat-tabs .cat-tab, .page .cat-tab').forEach(b=>b.classList.remove('active'));

  const all=S.get('pp_orders',[]);
  const list=status==='all'?all:all.filter(o=>o.status===status);
  document.getElementById('orders-tbody').innerHTML=renderOrdersRows(list);
}

function freeTableFromOrder(o){
  if(o&&o.type==='mesa'&&o.tableId){
    const tables=S.get('pp_tables',[]);
    const t=tables.find(x=>x.id===o.tableId);
    if(t){t.status='free';t.orderId=null;t.openedAt=null;S.set('pp_tables',tables);}
  }
}

function advanceOrder(id){
  const orders=S.get('pp_orders',[]);
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  let flow;
  if(o.type==='delivery'){
    flow=['pending','making','delivery','done'];
  } else {
    flow=['pending','making','ready','done'];
  }
  const idx=flow.indexOf(o.status);
  if(idx<flow.length-1){
    o.status=flow[idx+1];
    if(o.status==='done'&&o.tableId) freeTableFromOrder(o);
    S.set('pp_orders',orders);
    buildSidebar();navigate(currentPage);
  }
}

function cancelOrder(id){
  if(!confirm('Cancelar este pedido?'))return;
  const orders=S.get('pp_orders',[]);
  const o=orders.find(x=>x.id===id);
  if(o){
    o.status='cancelled';
    freeTableFromOrder(o);
    S.set('pp_orders',orders);
    buildSidebar();navigate('orders');
  }
}

  const orders=S.get('pp_orders',[]);
  el.innerHTML=`
  <div class="page-header" style="margin-bottom:16px">
    <h2>🪑 Mesas</h2>
    <button class="btn btn-gray btn-sm" onclick="navigate('tables')">↻ Atualizar</button>
  </div>
  <div class="mesas-grid">
    ${mesas.map(m=>{
      const activeOrder=orders.find(o=>o.tableId===m.id&&['pending','making','delivery','ready'].includes(o.status));
      return `<div class="mesa-card ${activeOrder?'occupied':'free'}" onclick="clickMesa(${m.id})">
        <div class="mesa-num">Mesa ${m.id}</div>
        <div class="mesa-status">${activeOrder?'Ped. #'+activeOrder.id:'Livre'}</div>
        ${activeOrder?`<div style="font-size:11px;margin-top:4px">${statusBadge(activeOrder.status)}</div>`:''}
        ${activeOrder?`<div style="font-size:11px;margin-top:4px;color:var(--red)">${fmt(activeOrder.total)}</div>`:''}
      </div>`;}).join('')}
  </div>`;
}

function clickMesa(id){
  const orders=S.get('pp_orders',[]);
  const active=orders.find(o=>o.tableId===id&&['pending','making','delivery','ready'].includes(o.status));
  if(active){
    openModal(`<div class="modal">
      <h3>🪑 Mesa ${id} — Pedido #${active.id}</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Cliente: ${active.client} — ${statusBadge(active.status)}</p>
      <p style="font-size:13px;margin-bottom:20px">Total atual: <strong style="color:var(--red)">${fmt(active.total)}</strong></p>
      <div style="display:flex;gap:10px">
        <button class="btn btn-gray" style="flex:1;justify-content:center" onclick="closeModal();viewOrder(${active.id})">👁 Ver Pedido</button>
        <button class="btn btn-blue" style="flex:1;justify-content:center" onclick="closeModal();addItemToOrder(${active.id})">➕ Itens</button>
        <button class="btn btn-green" style="flex:1;justify-content:center;background:var(--green)" onclick="closeModal();checkoutOrder(${active.id})">💰 Fechar</button>
      </div>
      <div class="modal-footer"><button class="btn btn-gray" onclick="closeModal()">Voltar</button></div>
    </div>`);
  } else {
    navigate('pdv');
    setTimeout(()=>{const sel=document.querySelector('[onclick*="setOrderType(\'mesa\'"]');if(sel)sel.click();},100);
  }
}

function openPromotionForm(id){

function savePromotion(id){const name=document.getElementById('pr-name').value.trim(),price=parseFloat(document.getElementById('pr-price').value),items=S.get('pp_promotions',[]);if(!name||isNaN(price)||price<0){alert('Informe nome e preço válidos');return}const data={id:id||nextId(items),name,description:document.getElementById('pr-desc').value.trim(),items:document.getElementById('pr-items').value.trim(),price,active:document.getElementById('pr-active').checked};const i=items.findIndex(x=>x.id===id);if(i>=0)items[i]=data;else items.push(data);S.set('pp_promotions',items);closeModal();productsView='promotions';navigate('products')}
function togglePromotion(id){const items=S.get('pp_promotions',[]),p=items.find(x=>x.id===id);if(p){p.active=!p.active;S.set('pp_promotions',items);navigate('products')}}
function deletePromotion(id){if(!confirm('Excluir esta promoção?'))return;S.set('pp_promotions',S.get('pp_promotions',[]).filter(p=>p.id!==id));navigate('products')}


function openProductForm(id){
  const items=S.get('pp_products',[]);
  const p=id?items.find(x=>x.id===id):null;
  const sizes=p?.sizes||[{name:'',price:''}];
  openModal(`<div class="modal modal-lg">

      <div class="form-row"><label>Categoria</label>
        <select id="pf-cat">

        </select>
      </div>
    </div>

      <div id="sizes-container">
        ${sizes.map((s,i)=>sizeRowHtml(s.name,s.price,i)).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="saveProduct(${id||'null'})">Salvar</button>

function sizeRowHtml(name,price,i){
  return `<div class="size-row" id="sz-${i}">
    <input placeholder="Nome (ex: Grande)" value="${name}" data-size-name>
    <input placeholder="Preço" type="number" step="0.01" value="${price}" data-size-price style="max-width:120px">
    <button class="remove-size" onclick="this.closest('.size-row').remove()">✕</button>
  </div>`;
}

let sizeIdx=10;
function addSizeRow(){
  const c=document.getElementById('sizes-container');
  c.insertAdjacentHTML('beforeend',sizeRowHtml('','',sizeIdx++));
}

function saveProduct(id){
  const name=document.getElementById('pf-name').value.trim();
  const category=document.getElementById('pf-cat').value;
  const description=document.getElementById('pf-desc').value.trim();
  if(!name){alert('Informe o nome do produto');return;}
  const sizeRows=document.querySelectorAll('#sizes-container .size-row');
  const sizes=[];
  sizeRows.forEach(row=>{
    const n=row.querySelector('[data-size-name]').value.trim();
    const pr=parseFloat(row.querySelector('[data-size-price]').value);
    if(n&&!isNaN(pr)) sizes.push({name:n,price:pr});
  });
  if(!sizes.length){alert('Adicione pelo menos um tamanho/preço');return;}
  const items=S.get('pp_products',[]);
  if(id){const p=items.find(x=>x.id===id);if(p){p.name=name;p.category=category;p.description=description;p.sizes=sizes;}}
  else items.push({id:nextId(items),name,category,description,active:true,sizes});
  S.set('pp_products',items);
  closeModal();
  navigate('products');
}

function toggleProduct(id){
  const items=S.get('pp_products',[]);
  const p=items.find(x=>x.id===id);
  if(p){p.active=!p.active;S.set('pp_products',items);navigate('products');}
}

function deleteProduct(id){
  if(!confirm('Excluir este produto?'))return;
  S.set('pp_products',S.get('pp_products',[]).filter(p=>p.id!==id));
  navigate('products');
}

}

function finDateKey(value){
  if(!value)return new Date().toISOString().slice(0,10);
  const s=String(value);
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m?`${m[3]}-${m[2]}-${m[1]}`:new Date(value).toISOString().slice(0,10);
}
function finToday(){return new Date().toISOString().slice(0,10)}
function finLabelDate(value){if(!value)return '-';const p=finDateKey(value).split('-');return `${p[2]}/${p[1]}/${p[0]}`}
function finNum(id){return parseFloat(document.getElementById(id)?.value)||0}
function finMovementLabel(c){return ({venda:'Venda',mercadoria:'Mercadoria',queijo:'Queijo',funcionarios:'Funcionários',aluguel:'Aluguel',energia:'Energia',internet:'Internet',salario:'Salário',cartao:'Cartão',moto:'Moto',divida:'Dívida',retirada:'Retirada pessoal',capital:'Capital de giro',reserva:'Reserva',conta:'Conta',outros:'Outros'})[c]||c||'Outros'}
function finDaysLeft(a){if(a.dueDate){const d=Math.ceil((new Date(`${a.dueDate}T23:59:59`)-new Date())/86400000);return Math.max(1,d)}return Math.max(1,parseInt(a.days)||1)}
function finOrders(){return S.get('pp_orders',[]).filter(o=>o.status==='done')}
function finPaymentTotals(orders){const out={dinheiro:0,cartao:0,pix:0,outros:0};orders.forEach(o=>{if(Array.isArray(o.payment)){o.payment.forEach(p=>{out[p.type]!==undefined?out[p.type]+=Number(p.value)||0:out.outros+=Number(p.value)||0})}else if(out[o.payment]!==undefined)out[o.payment]+=Number(o.total)||0;else out.outros+=Number(o.total)||0});return out}
function finSummary(){
  const orders=finOrders(), movements=S.get('pp_finance_movements',[]), today=finToday();
  const dates=orders.map(o=>finDateKey(o.createdAt)), weekStart=new Date();weekStart.setDate(weekStart.getDate()-6);const ws=weekStart.toISOString().slice(0,10);
  const revenue=orders.reduce((s,o)=>s+(Number(o.total)||0),0), dayRevenue=orders.filter(o=>finDateKey(o.createdAt)===today).reduce((s,o)=>s+(Number(o.total)||0),0), weekRevenue=orders.filter(o=>finDateKey(o.createdAt)>=ws).reduce((s,o)=>s+(Number(o.total)||0),0), monthRevenue=orders.filter(o=>finDateKey(o.createdAt).slice(0,7)===today.slice(0,7)).reduce((s,o)=>s+(Number(o.total)||0),0);
  const manualIn=movements.filter(m=>m.type==='entrada').reduce((s,m)=>s+(Number(m.value)||0),0), out=movements.filter(m=>m.type==='saida').reduce((s,m)=>s+(Number(m.value)||0),0), personal=movements.filter(m=>m.type==='saida'&&m.category==='retirada').reduce((s,m)=>s+(Number(m.value)||0),0), reserved=movements.filter(m=>m.type==='saida'&&['capital','reserva'].includes(m.category)).reduce((s,m)=>s+(Number(m.value)||0),0);
  const operational=out-personal-reserved, saldo=revenue+manualIn-out;
  return {orders,movements,revenue,dayRevenue,weekRevenue,monthRevenue,manualIn,out,personal,reserved,operational,saldo,byPayment:finPaymentTotals(orders)};
}

function openFinancialMovement(id){const m=S.get('pp_finance_movements',[]).find(x=>x.id===id);openModal(`<div class="modal"><h3>💰 ${m?'Editar':'Nova'} movimentação</h3><div class="form-cols"><div class="form-row"><label>Tipo</label><select id="fm-type"><option value="entrada" ${m?.type==='entrada'?'selected':''}>Entrada</option><option value="saida" ${m?.type==='saida'?'selected':''}>Saída</option></select></div><div class="form-row"><label>Data</label><input id="fm-date" type="date" value="${finDateKey(m?.date||finToday())}"></div></div><div class="form-cols"><div class="form-row"><label>Categoria</label><select id="fm-cat"><option value="outros">Outros</option><option value="retirada">Retirada pessoal</option><option value="mercadoria">Mercadoria</option><option value="queijo">Queijo</option><option value="conta">Conta</option><option value="capital">Capital de giro</option><option value="reserva">Reserva</option></select></div><div class="form-row"><label>Valor</label><input id="fm-value" type="number" step="0.01" value="${m?.value||''}"></div></div><div class="form-row"><label>Descrição</label><input id="fm-desc" value="${m?.description||''}" placeholder="Ex.: pagamento, compra, aporte..."></div><div class="form-row"><label>Observação</label><input id="fm-notes" value="${m?.notes||''}"></div><div class="modal-footer"><button class="btn btn-gray" onclick="closeModal()">Cancelar</button><button class="btn btn-blue" onclick="saveFinancialMovement(${id||'null'})">Salvar</button></div></div>`)}

function saveGeneralSettings(){
  const sett = {
    companyName: document.getElementById('set-name').value,
    companyCnpj: document.getElementById('set-cnpj').value,
    companyPhone: document.getElementById('set-phone').value,
    companyAddress: document.getElementById('set-addr').value,
    deliveryFee: parseFloat(document.getElementById('set-delivery').value)||0,
    serviceFee: parseFloat(document.getElementById('set-service').value)||0
  };
  S.set('pp_settings', sett);
  showAlert('settings-alert', 'success', '✅ Configurações salvas com sucesso!');
}

function exportBackup(){
  const data = {};
  SYNC_KEYS.forEach(k => data[k] = S.get(k));
  data['pp_settings'] = S.get('pp_settings');
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup_pizzaria_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function importBackup(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(confirm('Isso irá substituir TODOS os dados atuais. Deseja continuar?')){
        Object.entries(data).forEach(([k,v]) => S.set(k, v));
        alert('✅ Dados importados! O sistema será reiniciado.');
        location.reload();
      }
    } catch(err) { alert('❌ Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

function saveFirebaseConfig(){
  const config={
    apiKey:document.getElementById('fb-apiKey').value.trim(),
    authDomain:(document.getElementById('fb-project').value.trim())+'.firebaseapp.com',
    databaseURL:document.getElementById('fb-dbUrl').value.trim(),
    projectId:document.getElementById('fb-project').value.trim(),
    appId:document.getElementById('fb-appId').value.trim(),
  };
  if(!config.apiKey||!config.databaseURL||!config.projectId){
    showAlert('settings-alert','error','Preencha pelo menos API Key, Database URL e Project ID');return;
  }
  localStorage.setItem('pp_firebase_config',JSON.stringify(config));
  if(firebaseDb)try{Object.values(firebase.app().delete||(()=>{}));}catch(e){}
  if(typeof firebase!=='undefined'&&firebase.initializeApp){
    if(setupFirebase(config)){
      showAlert('settings-alert','success','✅ Sincronização ativada! Os dados já estão sendo compartilhados.');
      setTimeout(()=>navigate('settings'),1500);
    }else{
      showAlert('settings-alert','error','❌ Erro ao conectar. Verifique os dados.');
    }
  }else{
    showAlert('settings-alert','error','⏳ Firebase ainda carregando. Aguarde 5 segundos e tente novamente.');
  }
}

function disableFirebase(){
  if(!confirm('Desativar sincronização? Os dados deixarão de ser compartilhados entre dispositivos.'))return;
  localStorage.removeItem('pp_firebase_config');
  if(firebaseDb){try{firebaseDb=null;useFirebase=false;updateSyncUI();}catch(e){}}
  showAlert('settings-alert','success','📴 Sincronização desativada.');
  setTimeout(()=>navigate('settings'),1000);
}

function testSync(){
  if(!useFirebase){showAlert('settings-alert','error','Sincronização não está ativa.');return;}
  showAlert('settings-alert','success','🔄 Testando... Verifique o console do navegador (F12) para detalhes.');
  if(firebaseDb){
    firebaseDb.ref('pizzaria/_ping').set(Date.now()).then(()=>{
      console.log('✅ Firebase OK');
      showAlert('settings-alert','success','✅ Conexão funcionando!');
    }).catch(e=>{
      console.error('❌ Firebase erro',e);
      showAlert('settings-alert','error','❌ Erro: '+e.message);
    });
  }
}

function saveAccount(){
  const name=document.getElementById('acc-name').value.trim();
  const pass=document.getElementById('acc-pass').value;
  const pass2=document.getElementById('acc-pass2').value;
  if(!name){showAlert('acc-alert','error','Informe o nome');return;}
  if(pass&&pass!==pass2){showAlert('acc-alert','error','As senhas não coincidem');return;}
  const items=S.get('pp_users',[]);
  const u=items.find(x=>x.id===currentUser.id);
  if(u){u.name=name;if(pass)u.password=pass;}
  S.set('pp_users',items);
  currentUser.name=name;
  document.getElementById('header-name').textContent=name;
  showAlert('acc-alert','success','✅ Dados atualizados com sucesso!');
}

function filterAddProducts(q){
  const query=q.toLowerCase(),products=S.get('pp_products',[]).filter(p=>p.active&&(`${p.name} ${p.description||''}`).toLowerCase().includes(query)),promotions=S.get('pp_promotions',[]).filter(p=>p.active&&(`${p.name} ${p.description||''} ${p.items||''}`).toLowerCase().includes(query));

function filterAddCat(cat,btn){
  document.querySelectorAll('#add-cat-tabs .cat-tab').forEach(b=>b.classList.remove('active'));

  if(cat==='Promoções'){if(el)el.innerHTML=promotions.map(p=>promotionAddCard(p)).join('');return}
  const filtered=cat==='Todos'?products:products.filter(p=>p.category===cat);

function openAddPromotionOptions(id){
  const p=S.get('pp_promotions',[]).find(x=>x.id===id);if(!p)return;
  openModal(`<div class="modal"><h3>⚡ ${p.name}</h3>${p.description?`<p style="font-size:13px;color:var(--muted);margin-bottom:10px">${p.description}</p>`:''}${p.items?`<div style="background:rgba(240,192,0,.08);border:1px solid rgba(240,192,0,.25);padding:9px;border-radius:7px;font-size:12px;margin-bottom:14px">Itens: ${p.items}</div>`:''}<div class="form-row"><label>Preço promocional</label><div style="font-size:20px;font-weight:700;color:#f0c000">${fmt(p.price)}</div></div><div class="form-row"><label>Quantidade</label><input id="add-promo-qty" type="number" min="1" value="1"></div><div class="form-row"><label>Observação</label><input id="add-promo-obs" placeholder="Observação do pedido"></div><div class="modal-footer"><button class="btn btn-gray" onclick="closeLastModal()">Cancelar</button><button class="btn btn-red" onclick="addPromotionToOrderCart(${id})">Adicionar</button></div></div>`);
}
function addPromotionToOrderCart(id){
  const p=S.get('pp_promotions',[]).find(x=>x.id===id);if(!p)return;
  const qty=Math.max(1,parseInt(document.getElementById('add-promo-qty')?.value)||1),obs=document.getElementById('add-promo-obs')?.value.trim()||'',unitPrice=Number(p.price)||0;
  addItemsCart.push({id:`promo-${p.id}`,promotionId:p.id,name:p.name,category:'Promoção',size:'Promoção',border:'',qty,unitPrice,basePrice:unitPrice,price:unitPrice*qty,obs,isPromotion:true,items:p.items||''});
  closeLastModal();renderAddCart();
}

function addItemToCart(id){
  const p=S.get('pp_products',[]).find(x=>x.id===id);
  if(!p)return;
  const sizeEl=document.getElementById('ap-size');
  const sizeName=sizeEl.options[sizeEl.selectedIndex].dataset.name;
  const sizePrice=parseFloat(sizeEl.value);
  const borderEl=document.getElementById('ap-border');
  const borderName=borderEl?borderEl.options[borderEl.selectedIndex]?.dataset.name:'';
  const borderPrice=borderEl?parseFloat(borderEl.value)||0:0;
  const qty=Math.max(1,parseInt(document.getElementById('ap-qty').value)||1);
  const obs=document.getElementById('ap-obs').value.trim();
  let basePrice=sizePrice;
  let flavors=null;
  if(apHalfHalf&&isPizzaProduct(p)){
    const flavor1Id=parseInt(document.getElementById('ap-half-flavor-1')?.value);
    const flavor2Id=parseInt(document.getElementById('ap-half-flavor-2')?.value);
    if(!flavor1Id||!flavor2Id||flavor1Id===flavor2Id){alert('Escolha dois sabores diferentes para a pizza meio a meio.');return;}
    const products=S.get('pp_products',[]);
    const flavor1=products.find(x=>x.id===flavor1Id);
    const flavor2=products.find(x=>x.id===flavor2Id);
    basePrice=Math.max(getProductSize(flavor1,sizeName).price,getProductSize(flavor2,sizeName).price);
    flavors=[{id:flavor1.id,name:flavor1.name},{id:flavor2.id,name:flavor2.name}];
  }
  const unitPrice=basePrice+borderPrice;
  addItemsCart.push({id:p.id,name:p.name,category:p.category,size:sizeName,border:borderName,qty,unitPrice,basePrice,price:unitPrice*qty,obs,isHalfHalf:!!flavors,flavors});
  closeLastModal();
  renderAddCart();
}

function renderAddCart(){
  const el=document.getElementById('add-cart-items');
  if(!el)return;
  if(addItemsCart.length===0){el.innerHTML='<p style="color:var(--muted);font-size:12px;text-align:center;margin-top:20px">Nenhum item adicionado</p>';
    document.getElementById('add-cart-total').textContent='R$ 0,00';return;}
  el.innerHTML=addItemsCart.map((c,i)=>`
    <div class="cart-item" style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600">${c.qty}x ${itemDisplayName(c)}</div>
        <div style="font-size:10px;color:var(--muted)">${c.size}${c.border&&c.border!=='Sem Borda'?' · Borda '+c.border:''}${c.obs?' · '+c.obs:''}</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--red)">${fmt(c.price)}</div>
      <button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px" onclick="removeAddItem(${i})">✕</button>
    </div>`).join('');
  const total=addItemsCart.reduce((s,c)=>s+c.price,0);
  document.getElementById('add-cart-total').textContent=fmt(total);
}

function removeAddItem(i){addItemsCart.splice(i,1);renderAddCart();}

function closeAddItemsModal(){
  addItemsOrderId=null;
  addItemsCart=[];
  closeModal();
}

function confirmAddItems(){
  if(addItemsCart.length===0){alert('Adicione pelo menos um item');return;}
  if(!addItemsOrderId){alert('Pedido não encontrado');closeModal();return;}
  const orders=S.get('pp_orders',[]);
  const o=orders.find(x=>x.id===addItemsOrderId);
  if(!o){alert('Pedido não encontrado');closeModal();return;}
  const newTotal=addItemsCart.reduce((s,c)=>s+c.price,0);
  // Append new items
  o.items=o.items.concat(addItemsCart.map(c=>({...c})));
  o.total=(o.total||0)+newTotal;
  // If order was already in making/delivery/ready, reset to pending so kitchen sees it
  if(['making','delivery','ready'].includes(o.status)){
    o.status='pending';
  }
  S.set('pp_orders',orders);
  addItemsOrderId=null;
  addItemsCart=[];
  closeLastModal();
  buildSidebar();
  alert(`✅ ${fmt(newTotal)} em novos itens adicionados ao Pedido #${o.id}!\nTotal atualizado: ${fmt(o.total)}`);
  navigate(currentPage);
}

// ============================================================
// CHECKOUT MESA
let checkoutPayments = [];
function checkoutOrder(id){
  const o=S.get('pp_orders',[]).find(x=>x.id===id);
  if(!o)return;
  checkoutTotal=o.total||0;
  checkoutPayments = Array.isArray(o.payment) ? [...o.payment] : [];
  const title = o.type === 'mesa' ? `Fechar Comanda — Mesa ${o.tableId}` : `Concluir Pedido #${o.id}`;
  openModal(`<div class="modal">
    <h3>💰 ${title}</h3>
    <p style="margin-bottom:12px">Cliente: <strong>${o.client}</strong></p>
    <div style="background:var(--card2);padding:16px;border-radius:10px;margin-bottom:20px;text-align:center">
      <div style="font-size:14px;color:var(--muted)">Total a Pagar</div>
      <div style="font-size:32px;font-weight:800;color:var(--red)">${fmt(o.total)}</div>
    </div>
    
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">PAGAMENTO</p>
    <div id="checkout-pay-list" style="margin-bottom:10px"></div>
    <div class="form-cols" style="grid-template-columns: 1fr 100px 40px; gap: 5px; margin-bottom:10px">
      <select id="chk-pay-type" style="padding:6px; font-size:12px" onchange="toggleChangeCalc('chk-pay-type', 'chk-change-calc')">
        <option value="dinheiro">💵 Dinheiro</option>
        <option value="cartao">💳 Cartão</option>
        <option value="pix">📱 Pix</option>
      </select>
      <input id="chk-pay-val" type="number" step="0.01" min="0" placeholder="Valor" style="padding:6px; font-size:12px" oninput="syncPaymentAmount('checkout')">
      <button class="btn btn-green btn-xs" onclick="addPaymentRow('checkout-pay-list', 'chk-pay-val', 'chk-pay-type', 'chk-pay-remain', checkoutPayments, ${o.total})" style="justify-content:center">+</button>
    </div>
    <div id="chk-change-calc" style="margin-bottom:10px; font-size:12px; background:rgba(255,255,255,0.05); padding:8px; border-radius:6px; border:1px solid var(--border)">
      <div style="display:flex; justify-content:space-between; align-items:center">
<span>Recebido: <input id="chk-received" type="number" step="0.01" min="0" placeholder="0,00" style="width:78px; padding:4px; background:#000; border:1px solid var(--border); color:#fff; border-radius:4px" oninput="updateChange('chk-received', 'chk-pay-val', 'chk-change-val')"></span>
      <span>Troco: <strong id="chk-change-val" style="color:var(--green)">R$ 0,00</strong></span>
      </div>
    </div>
    <div id="chk-pay-remain" style="font-size:12px; color:var(--orange); margin-bottom:10px; text-align:right">Restante: ${fmt(o.total)}</div>

    <div class="modal-footer">
      <button class="btn btn-blue" onclick="printOrder(${id})">🖨️ Imprimir Comanda</button>
      <button class="btn btn-gray" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" style="background:var(--green)" onclick="finishTableOrder(${id})">Confirmar Pagamento</button>
    </div>
  </div>`);
  renderMultiPayments('checkout-pay-list','chk-pay-remain',checkoutPayments,o.total);
  toggleChangeCalc('chk-pay-type','chk-change-calc');
}

function finishTableOrder(id){
  const orders = S.get('pp_orders',[]);
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  
  const paid = checkoutPayments.reduce((s,p)=>s+p.value,0);
  if(paid < o.total) {
    if(!confirm(`O valor pago (${fmt(paid)}) é menor que o total (${fmt(o.total)}). Confirmar mesmo assim?`)) return;
  }
  
  o.payment = checkoutPayments.length > 0 ? checkoutPayments : 'Pendente';
  o.status = 'done';
  
  // Se for mesa, libera ela
  if(o.type === 'mesa') {
    freeTableFromOrder(o);
  }
  
  S.set('pp_orders', orders);
  checkoutTotal=0;
  closeModal();
  buildSidebar();
  alert('✅ Pedido concluído com sucesso!');
  navigate(currentPage);
}

function printOrder(id){
  const o = S.get('pp_orders', []).find(x => x.id === id);
  if(!o) return;
  
  const printEl = document.getElementById('print-section');
  const tipoLabel = o.type === 'mesa' ? `Mesa ${o.tableId}` : o.type.charAt(0).toUpperCase() + o.type.slice(1);
  
  let itemsHtml = o.items.map(i => `
    <tr>
      <td style="width:10%">${i.qty}x</td>
      <td style="width:60%">${itemDisplayName(i)}<br><small>${i.size}${i.border && i.border !== 'Sem Borda' ? ' + ' + i.border : ''}</small></td>
      <td style="width:30%; text-align:right">${fmt(i.price)}</td>
    </tr>
  `).join('');

  const sett = S.get('pp_settings', {});
  printEl.innerHTML = `
    <h2 style="text-align:center">${sett.companyName || 'PIZZARIA PATRÍCIO'}</h2>
    ${sett.companyCnpj ? `<p style="text-align:center; font-size:12px">CNPJ: ${sett.companyCnpj}</p>` : ''}
    ${sett.companyPhone ? `<p style="text-align:center; font-size:12px">Tel: ${sett.companyPhone}</p>` : ''}
    ${sett.companyAddress ? `<p style="text-align:center; font-size:12px">${sett.companyAddress}</p>` : ''}
    <hr style="border:1px dashed #000; margin:10px 0">
    <p style="text-align:center">Pedido #${o.id} - ${tipoLabel}</p>
    <p>Data: ${o.createdAt}</p>
    <p>Cliente: ${o.client}</p>
    ${o.address ? `<p>Endereço: ${o.address}</p>` : ''}
    ${o.obs ? `<p>Obs: ${o.obs}</p>` : ''}
    <table>
      <thead>
        <tr>
          <th>Qtd</th>
          <th>Item</th>
          <th style="text-align:right">Total</th>
        </tr>
      </thead>
      <tbody>
        ${itemsHtml}
      </tbody>
    </table>
    <div class="total-row">TOTAL: ${fmt(o.total)}</div>
    <p>Pagamento: ${o.payment === 'Aberto' ? 'Pendente' : (Array.isArray(o.payment) ? o.payment.map(p => `${p.type.toUpperCase()}: ${fmt(p.value)}${p.change>0?' (Troco: '+fmt(p.change)+')':''}`).join(' | ') : o.payment.toUpperCase())}</p>
    <div class="footer">
      <p>Obrigado pela preferência!</p>
      <p>Sistema Pizzaria Patrício</p>
    </div>
  `;
  
  window.print();
}

function printFinanceiro(){
  const orders=S.get('pp_orders',[]).filter(o=>o.status==='done');
  const total=orders.reduce((s,o)=>s+(o.total||0),0);
  const byPayment={dinheiro:0,cartao:0,pix:0};
  orders.forEach(o=>{
    if(Array.isArray(o.payment)){
      o.payment.forEach(p=>{ if(byPayment[p.type]!==undefined) byPayment[p.type]+=p.value; });
    } else if(byPayment[o.payment]!==undefined) {
      byPayment[o.payment]+=o.total||0;
    }
  });
  const sett = S.get('pp_settings', {});
  const printEl = document.getElementById('print-section');
  printEl.innerHTML = `
    <h2 style="text-align:center">${sett.companyName || 'PIZZARIA PATRÍCIO'}</h2>
    <h3 style="text-align:center">RELATÓRIO FINANCEIRO</h3>
    <p style="text-align:center">Data: ${now()}</p>
    <hr style="border:1px dashed #000; margin:15px 0">
    <div style="font-size:14px">
      <p><strong>Faturamento Total:</strong> ${fmt(total)}</p>
      <p><strong>Custo Est. (45%):</strong> ${fmt(total*0.45)}</p>
      <p><strong>Lucro Est.:</strong> ${fmt(total*0.55)}</p>
    </div>
    <hr style="border:1px dashed #000; margin:15px 0">
    <div style="font-size:14px">
      <p><strong>PAGAMENTOS:</strong></p>
      <p>💵 Dinheiro: ${fmt(byPayment.dinheiro)}</p>
      <p>💳 Cartão: ${fmt(byPayment.cartao)}</p>
      <p>📱 Pix: ${fmt(byPayment.pix)}</p>
    </div>
    <hr style="border:1px dashed #000; margin:15px 0">
    <p style="text-align:center; font-size:12px">Pizzaria Patrício</p>
  `;
  window.print();
}
